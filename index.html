<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#151629"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Banana Signal · Dawn Caravan</title>
<style>
:root{color-scheme:dark;--cyan:#6ff2ff;--gold:#ffe14d;--ink:#120c30;--edge:#7d4dff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;-webkit-touch-callout:none}
body{margin:0;background:#080c17;color:#eef4ff;font:15px/1.5 "Trebuchet MS",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit}
h1,h2,h3{font-family:"Arial Black",Impact,system-ui,sans-serif;font-style:italic;text-transform:uppercase}
h1{line-height:1;font-size:clamp(34px,8vw,68px);margin:6px 0;color:#fff;-webkit-text-stroke:2px #2a1650;text-shadow:0 5px 0 #6a2cd8,0 9px 18px #000a;letter-spacing:.02em}
h2{color:var(--gold);text-shadow:0 3px 0 #b0420f;margin:0 0 8px;font-size:clamp(19px,3.6vw,26px)}
h3{color:var(--cyan);margin:4px 0;font-size:15px}
p{margin:8px 0}
.muted{color:#b5bde0;font-size:12px}
.goldText{color:var(--gold)}
.key{color:var(--cyan)}

/* Game view */
#shell{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse,#22334c,#080c17 75%)}
#view{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;max-height:100%;overflow:hidden;background:#13172d;box-shadow:0 0 0 3px #405168,0 0 50px #000}
canvas#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#top{position:absolute;right:max(1%,env(safe-area-inset-right));top:1%;display:flex;gap:6px}
#top button{padding:5px 10px;font:800 11px "Arial Black",system-ui,sans-serif;color:#fff;border:2px solid #ffffff55;border-radius:8px;background:#1b1446cc;cursor:pointer}
#overlay[hidden],#touch[hidden],#top[hidden]{display:none}
#notice{position:fixed;left:50%;top:max(54px,env(safe-area-inset-top));transform:translateX(-50%);z-index:20;background:#1b1446ee;border:2px solid var(--gold);border-radius:999px;padding:7px 18px;max-width:90vw;text-align:center;pointer-events:none;font-size:13px;font-weight:700;opacity:0;transition:opacity .15s}

/* Menus */
#overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 15%,#5b2bd5c4,#1a0d3ae0 60%,#05030fe6);backdrop-filter:blur(5px)}
#panel{width:min(780px,100%);max-height:94dvh;overflow:auto;touch-action:pan-y;overscroll-behavior:contain;padding:clamp(14px,3vw,26px);border-radius:18px;background:linear-gradient(160deg,#3b2a8cf5,#1b1446f5 55%,#120c30f5);box-shadow:0 0 0 4px #ffffff22,0 0 0 8px #7d4dff55,0 20px 60px #000b}
#panel button{font:900 13px "Arial Black",Impact,system-ui,sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.03em;border:none;border-radius:11px;padding:11px 16px;min-height:44px;color:#fff;cursor:pointer;background:linear-gradient(#5b8cff,#3048d8);box-shadow:0 5px 0 #1b2582,0 8px 14px #0007;transition:transform .06s,filter .1s}
#panel button.primary{background:linear-gradient(#ffe95a,#ffb31f);color:#3a1f00;box-shadow:0 5px 0 #b0600a,0 8px 14px #0007}
#panel button.gold{background:linear-gradient(#c66bff,#8a2be2);box-shadow:0 5px 0 #4b137f,0 8px 14px #0007}
#panel button.ghost{background:#ffffff14;box-shadow:0 0 0 2px #ffffff33 inset}
#panel button:hover{filter:brightness(1.12)}
#panel button:focus-visible,#panel select:focus-visible,#panel input:focus-visible{outline:3px solid #fff;outline-offset:3px}
#panel button:active{transform:translateY(3px);box-shadow:0 2px 0 #0008}
#panel button:disabled{filter:grayscale(.85) brightness(.8);cursor:default;transform:none}
#panel .actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.card{position:relative;padding:12px;background:#ffffff10;border:2px solid #ffffff22;border-radius:12px;display:flex;flex-direction:column;gap:4px}
.card>button{margin-top:auto}
.card.on{border-color:var(--gold);background:#ffe14d14;box-shadow:0 0 18px #ffe14d33}
.card.locked{opacity:.92}
.badge{display:inline-block;font:900 10px "Arial Black",system-ui,sans-serif;padding:2px 8px;border-radius:999px;background:#7dffb0;color:#063;letter-spacing:.05em;vertical-align:middle}
.badge.eq{background:var(--gold);color:#3a1f00}
.badge.lock{background:#ffffff26;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:5px 12px;border-radius:999px;background:#0006;border:2px solid #ffffff22;font-weight:800;font-size:13px}
.chip b{color:var(--gold)}
.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
#panel .tabs button{flex:1;min-width:96px;background:#ffffff14;box-shadow:0 0 0 2px #ffffff33 inset}
#panel .tabs button.on{background:linear-gradient(#ffe95a,#ffb31f);color:#3a1f00;box-shadow:0 5px 0 #b0600a}
.portrait{width:72px;height:72px;image-rendering:pixelated;background:radial-gradient(circle,#ffffff22,#0000 70%);border-radius:10px;align-self:center}
.titleWrap{display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:center}
.titleWrap .portrait{width:clamp(96px,22vw,150px);height:clamp(96px,22vw,150px)}
.menuGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
#panel .menuGrid .big{grid-column:1/-1;font-size:19px;padding:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #ffffff22;padding:10px 0}
.row label{flex:1}
input[type=range]{width:min(150px,40vw);accent-color:var(--gold)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
select{max-width:185px;background:#120c30;color:#fff;padding:8px;border-radius:8px;border:2px solid #ffffff33}
#controller{font-size:11px;color:#b5bde0}

/* Touch controls */
#touch{position:fixed;inset:0;pointer-events:none;z-index:5;touch-action:none}
/* Movement joystick: the whole lower-left zone is the touch target; the base re-centres under the thumb. */
#stickZone{--stick:clamp(118px,min(30vw,34vh),168px);position:absolute;left:0;bottom:0;width:46%;height:64%;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:var(--stick);height:var(--stick);border-radius:50%;pointer-events:none;background:radial-gradient(circle,#ffffff14 38%,#ffffff2e 39%,#ffffff0e 70%);border:3px solid #ffffff55;box-shadow:0 0 22px #6ff2ff44 inset;transition:border-color .08s}
#stick.active{border-color:#6ff2ffcc;box-shadow:0 0 26px #6ff2ff88 inset,0 0 18px #6ff2ff55}
#knob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#8fe9ff 35%,#2f7fd8);box-shadow:0 6px 0 #164a8a,0 8px 16px #0008;pointer-events:none}
/* Action cluster: round thumb buttons, primary actions on the bottom row nearest the thumb. */
#combat{--btn:clamp(64px,min(11vw,21vh),92px);--gap:clamp(7px,1.4vw,12px);position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,var(--btn));grid-template-areas:"skill ult shot" "dash slash jump";gap:var(--gap);pointer-events:none;touch-action:none}
#combat button{--c1:#7fb2ff;--c2:#2a4fd0;--cd:0;position:relative;width:var(--btn);height:var(--btn);padding:0;border-radius:50%;border:3px solid #ffffffb0;pointer-events:auto;touch-action:none;cursor:pointer;font:900 clamp(10px,calc(var(--btn)*.17),15px) "Arial Black",system-ui,sans-serif;letter-spacing:.03em;color:#fff;text-shadow:0 1px 2px #000,0 0 6px #0008;background:radial-gradient(circle at 35% 28%,var(--c1),var(--c2));box-shadow:0 6px 0 #0009,inset 0 3px 0 #ffffff66,0 9px 18px #0006;opacity:.86;transition:transform .05s,filter .05s,box-shadow .05s;overflow:hidden}
#combat [data-action=slash]{grid-area:slash;--c1:#ff8a8a;--c2:#d0232a}
#combat [data-action=jump]{grid-area:jump;--c1:#8affb0;--c2:#1d9a4a}
#combat [data-action=dash]{grid-area:dash;--c1:#c9b6ff;--c2:#5b3fd0}
#combat [data-action=shot]{grid-area:shot;--c1:#7fe3ff;--c2:#1a78c8}
#combat [data-action=skill]{grid-area:skill;--c1:#ffe66a;--c2:#d68a00}
#combat [data-action=ult]{grid-area:ult;--c1:#f0a6ff;--c2:#8a1fd0}
#combat button.pressed{transform:translateY(5px) scale(.93);filter:brightness(1.4) saturate(1.2);border-color:#fff;opacity:1;box-shadow:0 1px 0 #0009,inset 0 3px 10px #0007,0 0 0 5px #ffffff55,0 0 22px var(--c1)}
/* Cooldown / charge wipe driven from the game loop through --cd (0 ready .. 1 empty). */
#combat button::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#000b calc(var(--cd)*360deg),#0000 0);pointer-events:none}
#combat button.ready{animation:ready 1s infinite alternate}
@keyframes ready{to{box-shadow:0 6px 0 #0009,inset 0 3px 0 #ffffff66,0 0 0 4px #ffffff66,0 0 26px var(--c1)}}
@media(orientation:portrait){
 #view{width:100vw;align-self:start;margin-top:env(safe-area-inset-top)}
 #stickZone{--stick:clamp(100px,28vw,150px);height:46%}
 #stick{bottom:max(34px,env(safe-area-inset-bottom))}
 #combat{--btn:clamp(64px,18vw,84px);bottom:max(34px,env(safe-area-inset-bottom));right:max(10px,env(safe-area-inset-right))}
 #panel{max-height:88dvh}
}
@media(max-height:420px){
 #stick{bottom:max(8px,env(safe-area-inset-bottom))}
 #combat{bottom:max(8px,env(safe-area-inset-bottom))}
 #panel{padding:12px;max-height:96dvh}
 h1{font-size:30px}
 .titleWrap .portrait{width:84px;height:84px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="shell"><div id="view"><canvas id="game" width="480" height="320" aria-label="Banana Signal action platformer"></canvas><div id="top" hidden><button id="shopButton" aria-label="Workshop: upgrades, skills and heroes">SHOP</button><button id="pauseButton" aria-label="Pause game">Ⅱ</button></div></div></div>
<div id="touch" hidden aria-label="Touch game controls"><div id="stickZone" aria-label="Movement joystick"><div id="stick"><div id="knob"></div></div></div><div id="combat"><button data-action="skill" aria-label="Use equipped skill">SKILL</button><button data-action="ult" aria-label="Ultimate">ULT</button><button data-action="shot" aria-label="Bolt: hold to charge">BOLT</button><button data-action="dash" aria-label="Dash">DASH</button><button data-action="slash" aria-label="Slash">SLASH</button><button data-action="jump" aria-label="Jump">JUMP</button></div></div>
<div id="overlay"><main id="panel"></main></div><div id="notice" role="status" aria-live="polite"></div>
<script>
'use strict';
let ctx=document.getElementById('game').getContext('2d');
const $=id=>document.getElementById(id),canvas=$('game'),W=480,H=320,GROUND=274;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const SEED='banana_signal_v2',SETTINGS='banana_signal_settings_v2';let storageOK=true;
function readJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch(e){storageOK=false;return fallback}}
function writeJSON(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){storageOK=false;return false}}
const defaults=()=>({version:2,bananas:0,upgrades:{blade:0,bolt:0,armor:0,energy:0,magnet:0},unlocked:1,cleared:[],best:{},skills:['cyclone'],skill:'cyclone',heroes:['kip'],hero:'kip',stage:1,kills:0,deaths:0,time:0,won:false});
function cleanSave(raw){const d=defaults();if(!raw||raw.version!==2)return d;for(const k of ['bananas','kills','deaths','time'])d[k]=Number.isFinite(raw[k])?clamp(Math.floor(raw[k]),0,1e9):0;d.unlocked=clamp(Math.floor(Number(raw.unlocked)||1),1,9);d.stage=clamp(Math.floor(Number(raw.stage)||1),1,d.unlocked);d.cleared=Array.isArray(raw.cleared)?[...new Set(raw.cleared.filter(n=>Number.isInteger(n)&&n>=1&&n<=9))]:[];for(const k in d.upgrades)d.upgrades[k]=clamp(Math.floor(Number(raw.upgrades?.[k])||0),0,5);for(let n=1;n<=9;n++)if(Number.isFinite(raw.best?.[n])&&raw.best[n]>0)d.best[n]=raw.best[n];d.won=raw.won===true;for(const kind of ['skill','hero']){const list=catalog(kind),owned=kind+(kind==='hero'?'es':'s');if(Array.isArray(raw[owned]))for(const k of raw[owned])if(list.some(i=>i.key===k)&&!d[owned].includes(k))d[owned].push(k);if(d[owned].includes(raw[kind]))d[kind]=raw[kind]}return d}
// Playable heroes: bought with bananas, each with different movement/combat numbers and its own ultimate.
const heroes=[
{key:'kip',name:'Kip',cost:0,ult:'dawn',ultName:'DAWN BREAKER',desc:'Balanced salvage-runner. Double jump and one air dash.',ultDesc:'Dawn Breaker: clears every enemy shot and hits everything on screen.'},
{key:'bat',name:'Bat Monkey',cost:350,ult:'swarm',ultName:'NIGHT SWARM',hp:.8,speed:1.14,jumps:3,glide:true,desc:'Triple jump, glides while JUMP is held in the air, runs 14% faster. 20% less armor.',ultDesc:'Night Swarm: eight homing sonic bats.'},
{key:'hood',name:'Hood Monkey',cost:350,ult:'storm',ultName:'SHADOW STORM',blade:1.3,bolt:.75,dashLen:1.45,dashCost:12,desc:'Saber hits 30% harder; dash goes 45% farther for less energy. Bolts are 25% weaker.',ultDesc:'Shadow Storm: untouchable teleporting blade flurry.'}];
// Active skills: one is equipped at a time (SKILL button / Q / LB). Each costs energy and has a cooldown.
const skills=[
{key:'cyclone',name:'Cyclone Cut',cost:0,en:28,cd:3,desc:'Spinning saber hits both sides twice, shreds enemy shots and makes you briefly untouchable.'},
{key:'fang',name:'Rising Fang',cost:120,en:26,cd:3.5,desc:'Launching uppercut for heavy damage. Refreshes your air jump and air dash.'},
{key:'volley',name:'Banana Volley',cost:150,en:34,cd:4.5,desc:'Five-bolt spread that pierces straight through robots.'},
{key:'barrier',name:'Relay Barrier',cost:180,en:40,cd:9,desc:'4-second shield that absorbs two hits, then bursts and damages nearby robots.'},
{key:'patch',name:'Field Patch',cost:240,en:55,cd:22,desc:'Restores 30% of maximum armor on the spot.'}];
const catalog=kind=>kind==='hero'?heroes:skills,ownedList=(data,kind)=>data[kind==='hero'?'heroes':'skills'];
// Purchases fail (and change nothing) when the item is unknown, already owned or unaffordable.
function buyItem(data,kind,key){const item=catalog(kind).find(i=>i.key===key),owned=ownedList(data,kind);if(!item||owned.includes(key)||data.bananas<item.cost)return false;data.bananas-=item.cost;owned.push(key);return true}
function equipItem(data,kind,key){if(!ownedList(data,kind).includes(key))return false;data[kind]=key;return true}
let save=cleanSave(readJSON(SEED,null));const hero=()=>heroes.find(h=>h.key===save.hero)||heroes[0],maxHpNow=()=>Math.round((36+save.upgrades.armor*6)*diff().hp*(hero().hp||1));const pref=readJSON(SETTINGS,{}),settings={volume:clamp(Number(pref.volume??.7)||0,0,1),music:clamp(Number(pref.music??.5)||0,0,1),sfx:clamp(Number(pref.sfx??.7)||0,0,1),difficulty:['story','hard','nightmare'].includes(pref.difficulty)?pref.difficulty:'hard',touch:['auto','on','off'].includes(pref.touch)?pref.touch:'auto',shake:pref.shake!==false};
const DIFFICULTY={story:{hp:1.5,damage:.6,speed:.85,retries:5,label:'STORY'},hard:{hp:1,damage:1,speed:1,retries:2,label:'HARD'},nightmare:{hp:.8,damage:1.6,speed:1.18,retries:0,label:'NIGHTMARE'}};const diff=()=>DIFFICULTY[game.difficulty||settings.difficulty];
const upgrades=[{key:'blade',name:'Prism Saber',base:30,desc:'+2 slash damage per level; longer reach.'},{key:'bolt',name:'Pulse Blaster',base:25,desc:'+2 bolt damage per level, including charge shots.'},{key:'armor',name:'Gorilla Guard',base:30,desc:'+6 maximum HP per level. Purchase repairs armor.'},{key:'energy',name:'Ion Capacitor',base:25,desc:'+15 energy and faster charging per level.'},{key:'magnet',name:'Banana Magnet',base:15,desc:'+22 pixel banana pickup range per level.'}];
const activeSkill=()=>skills.find(k=>k.key===save.skill)||skills[0];
function upgradeCost(item,level){return Math.round(item.base*Math.pow(1.65,level))}function purchase(data,key){const item=upgrades.find(u=>u.key===key);if(!item)return false;const level=data.upgrades[key],cost=upgradeCost(item,level);if(level>=5||data.bananas<cost)return false;data.bananas-=cost;data.upgrades[key]++;return true}
function persist(){return writeJSON(SEED,save)}
// Saves are written synchronously; flushSave is the explicit "make sure it is on disk now" entry point.
function flushSave(){return persist()}
let noticeTimer;function notify(text){$('notice').textContent=text;$('notice').style.opacity=1;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').style.opacity=0,2600)}
const stages=[
{name:'PRISM HOLLOW',boss:'CARAPACE-IX',kind:'beetle',color:'#a776ff',sky:'#1b1b40',pattern:'fan',text:'The caravan seed-vault is failing. Kip must reopen eight climate relays before the last living orchard freezes. A beetle siege engine nests in the crystal mine.'},
{name:'SCRAP CANOPY',boss:'IRON KONG',kind:'gorilla',color:'#77c7a3',sky:'#0c2830',pattern:'slam',text:'Steel vines feed an abandoned salvage garden. Iron Kong hoards its soil filters. Mechanic Nori needs those filters, not another trophy.'},
{name:'TIDAL CIRCUIT',boss:'MANTA COIL',kind:'drone',color:'#66d9f2',sky:'#102945',pattern:'wave',text:'The pumps are drowning the lower decks. A floating sentinel mistakes the caravan for a flood. Shut its coils down without destroying the freshwater reserve.'},
{name:'EMBER FOUNDRY',boss:'CINDER MANTIS',kind:'wasp',color:'#ff975d',sky:'#351c30',pattern:'dash',text:'Seed sterilizers have become furnaces. Cinder Mantis obeys orders from Warden Oryx: no harvest outside the citadel. Take back the heat exchanger.'},
{name:'SKY GLASS',boss:'VESPA REGENT',kind:'wasp',color:'#a3d4ff',sky:'#233556',pattern:'rain',text:'Cross the suspension bridges and claim a wind relay. Vespa Regent commands the courier swarm that once carried pollen between cities.'},
{name:'NIGHT ARCHIVE',boss:'WIDOW HEX',kind:'spider',color:'#c897ef',sky:'#221531',pattern:'blink',text:'In the archive, Kip finds the truth: the orchard is not dead. Oryx locked it away to make every settlement dependent on the citadel. Widow Hex guards the evidence.'},
{name:'ION HEART',boss:'TITAN AMP',kind:'gorilla',color:'#f6d976',sky:'#2d2838',pattern:'ring',text:'The caravan is at the gate. Titan Amp draws power from the weather grid. Break its rhythm, then redirect that power to the seed-vault.'},
{name:'VERDANT SPIRE',boss:'ORYX PRIME',kind:'gorilla',color:'#83edcb',sky:'#152b3b',pattern:'all',text:'Eight relays, one last lock. Oryx Prime would rather shatter the weather engine than share a season. Nori begins the transfer. Hold the spire.'},
{name:'DAWN ENGINE',boss:'THE CLOSED SUN',kind:'drone',color:'#ffcd83',sky:'#31203e',pattern:'all',text:'Oryx is defeated, but the engine has learned his fear. It is sealing the orchard permanently. Kip enters the core to teach it a different ending.'}
];
const storyStart=['KIP // DAWN CARAVAN','A hundred traveling families carry the last seeds of their old home. Their destination is a living orchard behind the citadel walls. Warden Oryx has sealed it.','Kip, a salvage-runner with a patched teal suit and a prism saber, volunteers to reopen eight climate relays. Nori will keep the caravan moving.','Every guardian controls something the families need: clean water, warmth, soil, wind. The job is not revenge. It is a harvest.'];
const game={ult:0,flash:0,ultLock:false,state:'menu',stage:1,cam:0,time:0,total:0,shake:0,freeze:0,boss:null,checkpoint:40,retries:2,kills:0,clearing:false,checkpointNotice:0};let player=null,level=null,enemies=[],shots=[],loot=[],effects=[],floating=[],tick=0;
const keys={},touches=new Map();let pad={},input={},previous={},padID='',padNav={};
const keymap={left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],jump:['Space','KeyZ','ArrowUp'],slash:['KeyX','KeyJ'],dash:['ShiftLeft','ShiftRight','KeyC'],shot:['KeyV','KeyK'],skill:['KeyQ'],ult:['KeyE'],pause:['Escape','KeyP'],shop:['KeyB']};
// Movement joystick state: x/y are -1..1; DEAD is the dead zone as a fraction of knob travel.
const stick={id:null,x:0,y:0,cx:0,cy:0,r:50},DEAD=.24,stickZone=$('stickZone'),stickBase=$('stick'),stickKnob=$('knob');
function stickSet(dx,dy){const r=stick.r,d=Math.hypot(dx,dy),k=d>r?r/d:1;dx*=k;dy*=k;stick.x=dx/r;stick.y=dy/r;stickKnob.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)'}
function stickClear(){const id=stick.id;stick.id=null;stick.x=stick.y=0;stickKnob.style.transform='';stickBase.style.left=stickBase.style.top=stickBase.style.bottom='';stickBase.classList.remove('active');if(id!==null)try{stickZone.releasePointerCapture(id)}catch(e){}}

function enemyShot(e,speed=105,angle=null){const a=angle??Math.atan2(player.y+12-e.y,player.x+9-e.x);shots.push({x:e.x+e.w/2,y:e.y+e.h/2,w:6,h:6,vx:Math.cos(a)*speed*diff().speed,vy:Math.sin(a)*speed*diff().speed,life:4,friendly:false,damage:6})}
function updateEnemies(dt){for(const e of enemies){if(e.dead||Math.abs(e.x-player.x)>650)continue;e.t+=dt;e.cool-=dt;e.hit=Math.max(0,e.hit-dt);e.face=player.x>e.x?1:-1;if(e.type==='wasp'){e.x+=Math.sin(e.t)*18*dt;e.y=e.baseY+Math.sin(e.t*4)*16;if(e.cool<=0&&Math.abs(e.x-player.x)<270){enemyShot(e);e.cool=2.2/diff().speed}}else{e.vy=Math.min(390,e.vy+620*dt);if(e.type==='gorilla'){e.vx=Math.abs(player.x-e.x)<210?e.face*34:0;if(e.ground&&e.cool<=0){e.vy=-180;e.vx=e.face*75;e.cool=2}}else if(e.type==='beetle')e.vx=Math.cos(e.t)*28;else if(e.cool<=0&&Math.abs(e.x-player.x)<290){enemyShot(e,130);e.cool=1.7/diff().speed}move(e,dt);if(e.y>H+100)e.dead=true}if(!e.dead&&overlap(player,e))hurtPlayer(e.type==='gorilla'?11:7)}}
function spawnBoss(){shots=[];enemies=enemies.filter(e=>e.x<level.arena-100);const s=stages[game.stage-1];game.boss={x:level.width-115,y:GROUND-52,w:46,h:52,hp:190+game.stage*24,maxHp:190+game.stage*24,phase:1,state:'intro',timer:1.5,fire:0,pattern:s.pattern,action:s.pattern,face:-1,hit:0,dead:false,deathTime:1.8,sequence:0,lockedX:player.x,warning:''};game.checkpoint=level.arena-100;notify(s.boss+' · read the wind-up, then strike');audio.fx('warn')}
function damageBoss(amount){const b=game.boss;if(!b||b.dead||b.state==='intro')return;gainUlt(amount*.5);b.hp=Math.max(0,b.hp-amount);b.hit=.1;text(b.x+20,b.y,amount);audio.fx('hit');if(b.hp<=0){b.dead=true;shots=shots.filter(s=>s.friendly);game.shake=8;burst(b.x+23,b.y+26,'#c3ffff',40);audio.fx('win');save.bananas+=75+game.stage*15;persist();notify('Guardian defeated · +'+(75+game.stage*15)+' bananas')}else if(b.hp<b.maxHp*.5&&b.phase===1){b.phase=2;b.state='tell';b.timer=1.1;b.warning='OVERCLOCK';b.action='ring';b.fire=0;notify(stages[game.stage-1].boss+' · OVERCLOCK PHASE')}}
function bossProjectile(b,angle,speed=115,damage=8,w=7,h=7){shots.push({x:b.x+b.w/2,y:b.y+20,w,h,vx:Math.cos(angle)*speed*diff().speed,vy:Math.sin(angle)*speed*diff().speed,damage,friendly:false,life:4,boss:true})}
function chooseBossAction(b){const patterns=[b.pattern,'fan',b.pattern,'ring',b.pattern,'dash'];b.action=patterns[b.sequence++%patterns.length];if(b.action==='all')b.action=['fan','rain','slam','ring','blink'][b.sequence%5];b.state='tell';b.timer=(b.phase===2?.55:.8)/diff().speed;b.lockedX=player.x;b.face=player.x>b.x?1:-1;b.warning={fan:'PRISM FAN',slam:'GROUND BREAK',wave:'TIDAL PULSE',dash:'BLADE RUSH',rain:'SKY FALL',blink:'PHASE SHIFT',ring:'RING BURST'}[b.action]||'CHARGING';b.fire=0}
function updateBoss(dt){const b=game.boss;if(!b)return;if(b.dead){b.deathTime-=dt;if(b.deathTime<=0&&!game.clearing){game.clearing=true;clearStage()}return}b.hit=Math.max(0,b.hit-dt);b.timer-=dt;b.face=player.x>b.x?1:-1;if(b.state==='intro'){if(b.timer<=0){b.state='rest';b.timer=.6}return}if(b.state==='rest'){if(b.timer<=0)chooseBossAction(b)}else if(b.state==='tell'){if(b.timer<=0){b.state='attack';b.dashFace=b.face;b.timer=b.action==='dash'?.65:1.2;b.fire=0;if(b.action==='blink'){b.x=clamp(b.lockedX+80,level.arena+12,level.width-62);burst(b.x,b.y,'#c3a0ff',10)}}}else if(b.state==='attack'){b.fire-=dt;if(b.action==='dash')b.x+=b.dashFace*(b.phase===2?185:145)*dt;else if(b.action==='slam'){b.y=GROUND-b.h-Math.sin(Math.PI*clamp((1.2-b.timer)/1.2,0,1))*88;if(b.timer<=.08&&b.fire<=0){b.fire=9;game.shake=7;for(const dir of [-1,1])shots.push({x:b.x+23,y:GROUND-10,w:16,h:10,vx:dir*170*diff().speed,vy:0,life:3,friendly:false,damage:10,boss:true})}}else if(b.fire<=0){b.fire=b.phase===2?.26:.4;const aim=Math.atan2(player.y+12-(b.y+20),player.x+9-(b.x+23));switch(b.action){case 'ring':for(let i=0;i<10;i++)bossProjectile(b,i*Math.PI/5+tick*.001,96);b.fire=2;break;case 'rain':shots.push({x:clamp(b.lockedX+Math.sin(b.timer*9)*52,level.arena,level.width-12),y:35,w:9,h:21,vx:0,vy:190*diff().speed,life:3,friendly:false,damage:9,boss:true});break;case 'wave':bossProjectile(b,aim-.2,120);bossProjectile(b,aim+.2,120);break;case 'blink':bossProjectile(b,aim,155,9,12,7);break;default:for(let i=-1;i<=1;i++)bossProjectile(b,aim+i*.26,120)}}if(b.timer<=0){b.state='rest';b.timer=b.phase===2?.65:1.05;b.y=GROUND-b.h}}b.x=clamp(b.x,level.arena+8,level.width-b.w-8);if(overlap(player,b))hurtPlayer(b.state==='attack'?12:8)}
function updateShots(dt){for(let i=shots.length-1;i>=0;i--){const b=shots[i];if(b.homing){let t=null,best=260;for(const e of [...enemies,game.boss])if(e&&!e.dead){const d=Math.hypot(e.x+e.w/2-b.x,e.y+e.h/2-b.y);if(d<best){best=d;t=e}}if(t){const a=Math.atan2(t.y+t.h/2-b.y,t.x+t.w/2-b.x);b.vx+=(Math.cos(a)*230-b.vx)*Math.min(1,dt*7);b.vy+=(Math.sin(a)*230-b.vy)*Math.min(1,dt*7)}}b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let gone=b.life<=0||b.x<-20||b.x>level.width+20||b.y>H+30;if(!gone&&b.friendly){for(const e of enemies)if(!e.dead&&overlap(e,b)){if(b.pierce){if(!b.seen.has(e)){b.seen.add(e);damageEnemy(e,b.damage)}}else{damageEnemy(e,b.damage);gone=true;break}}if(!gone&&game.boss&&!game.boss.dead&&overlap(b,game.boss)&&!b.seen?.has(game.boss)){damageBoss(b.damage);if(b.pierce)b.seen.add(game.boss);else gone=true}}else if(!gone&&!player.dead&&overlap(b,player)){hurtPlayer(b.damage);gone=true}if(!gone&&!b.homing&&level.solids.some(s=>overlap(b,s)))gone=true;if(gone)shots.splice(i,1)}}
function updateLoot(dt){for(let i=loot.length-1;i>=0;i--){const l=loot[i],dx=player.x+9-l.x,dy=player.y+15-l.y,d=Math.hypot(dx,dy);if(d<24+save.upgrades.magnet*22&&!player.dead){l.x+=dx*dt*9;l.y+=dy*dt*9}else if(!l.ground){const oldBottom=l.y+l.h;l.vy+=320*dt;l.y+=l.vy*dt;for(const s of level.solids)if(l.vy>0&&oldBottom<=s.y+3&&l.y+l.h>=s.y&&l.x+l.w>s.x&&l.x<s.x+s.w){l.y=s.y-l.h;l.vy=0;l.ground=true;break}}if(!player.dead&&overlap(player,l)){save.bananas+=l.v;audio.fx('banana');text(l.x,l.y,'+'+l.v+' BAN');loot.splice(i,1);persist()}else if(l.y>H+120)loot.splice(i,1)}}
function updateFX(dt){for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life-=dt;if(e.ring)e.r+=e.vr*dt;else{e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=160*dt}if(e.life<=0)effects.splice(i,1)}for(let i=floating.length-1;i>=0;i--){floating[i].life-=dt;floating[i].y-=18*dt;if(floating[i].life<=0)floating.splice(i,1)}}
function update(dt){if(pressed('pause')){if(game.state==='play')pauseMenu();else if(game.state==='pause')resume()}if(pressed('shop')&&game.state==='play')shop('pause');if(game.state!=='play')return;save.time+=dt;game.time+=dt;game.total+=dt;if(game.freeze>0){game.freeze-=dt;return}updatePlayer(dt);if(game.state!=='play')return;if(!player.dead){updateEnemies(dt);updateBoss(dt);updateShots(dt);updateLoot(dt)}updateFX(dt);game.cam=clamp(player.x-140,0,level.width-W);if(game.boss&&!game.boss.dead)game.cam=level.width-W;if(Math.floor(game.total/5)!==Math.floor((game.total-dt)/5))persist()}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clock(seconds){const m=Math.floor(seconds/60);return m+':'+String(Math.floor(seconds%60)).padStart(2,'0')}

function drawPortrait(target,key){const main=ctx;try{ctx=target.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,target.width,target.height);ctx.translate(target.width/2-9,target.height/2-14);drawRunner({x:0,y:0,w:18,h:30,vx:0,vy:0,face:1,ground:true,inv:0,attack:0,charge:0,spin:0,rise:0,shield:0,dash:0,look:key},true)}finally{ctx=main;ctx.setTransform(1,0,0,1,0,0)}}
function render(){
 ctx.setTransform(1,0,0,1,0,0);background();
 if(level&&player){ctx.save();const shake=settings.shake?game.shake:0;ctx.translate(-Math.floor(game.cam)+(Math.random()-.5)*shake,(Math.random()-.5)*shake);drawLevel();

 for(const e of enemies)if(!e.dead&&e.x+e.w>game.cam-30&&e.x<game.cam+W+30)robot(e);

 }else{for(let i=0;i<20;i++){const x=(i*37+tick*.1)%W,y=240+Math.sin(i+tick*.01)*18;rect(x,y,3,3,'#8fd5ce')}label('DAWN CARAVAN // SIGNAL STANDBY',240,300,'#7292a6',8,'center')}

// Mirrors skill cooldown and ultimate charge onto the touch buttons (only touching the DOM when the value changes).
function syncButtons(){if(game.state!=='play'||!player)return;const s=activeSkill(),a=Math.round((player.skillCD>0?player.skillCD/player.skillMax:player.en<s.en?1:0)*50)/50,b=Math.round((1-game.ult/100)*50)/50;if(a!==shownSkill){shownSkill=a;skillButton.style.setProperty('--cd',a)}if(b!==shownUlt){shownUlt=b;ultButton.style.setProperty('--cd',b);ultButton.classList.toggle('ready',b===0)}}
let lastFrame=0,accumulator=0;
function frame(now){const elapsed=lastFrame?Math.min((now-lastFrame)/1000,.1):0;lastFrame=now;accumulator+=elapsed;
 // Fixed 120 Hz simulation prevents refresh-rate-dependent movement and collision tunneling.
 let steps=0;while(accumulator>=1/120&&steps<12){pollInput();update(1/120);game.shake=Math.max(0,game.shake-25/120);game.flash=Math.max(0,game.flash-1/120);accumulator-=1/120;tick++;steps++}
 audio.update();render();syncButtons();requestAnimationFrame(frame);
}
