<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0d17">
<title>Nighttail — The Hollow Crown</title>
<style>
:root{--paper:#0f0d17;--surface:#191527;--line:#332c48;--ink:#f2eeff;--muted:#a89fc4;--accent:#e8b64c;--r:10px;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
h1{font-size:32px;line-height:1.1;margin:0 0 8px}
h2{font-size:20px;margin:0 0 8px}
p{margin:0 0 16px;color:var(--muted)}
#shell{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;max-height:100%;background:#080711;overflow:hidden;border-radius:var(--r);box-shadow:0 0 0 1px var(--line)}
canvas#game{display:block;width:100%;height:100%}
#hud{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:16px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums;pointer-events:none;text-shadow:0 2px 2px #000c}
#hud .bar{display:inline-block;width:96px;height:10px;vertical-align:middle;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#0008}
#hud .bar i{display:block;height:100%;background:var(--accent);transition:width .15s linear}
#hud .grow{flex:1}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#080711e6;padding:24px;overflow:auto;z-index:5}
#overlay[hidden]{display:none}
#panel{max-width:520px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
#panel .eyebrow{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
#panel .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
#panel .foot{margin:16px 0 0;font-size:14px}
button{font:inherit;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:background .15s,transform .1s,border-color .15s}
button:hover{background:#241e37;border-color:var(--accent)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
button[disabled]:hover{background:var(--paper);border-color:var(--line)}
button.primary{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:700}
button.primary:hover{background:#f2c65e}
#touch{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;pointer-events:none;z-index:4}
#touch[hidden]{display:none}
#touch .pad,#touch .acts{display:flex;gap:8px;pointer-events:auto}
#touch button{min-height:56px;padding:0 12px;background:#191527d9;font-weight:700}
#touch .pad button{width:72px;height:72px;min-height:72px}
#notice{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:#191527f2;border:1px solid var(--accent);border-radius:var(--r);padding:8px 16px;max-width:90%;text-align:center;opacity:0;transition:opacity .2s linear;pointer-events:none;z-index:3}
#notice.on{opacity:1}
#settings row{display:flex}
label.check{display:flex;gap:8px;align-items:center;margin-top:16px;min-height:44px}
@media (max-width:820px){h1{font-size:24px}#panel{padding:16px}#hud{gap:8px;font-size:12px}#hud .bar{width:64px}#notice{bottom:104px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="shell"><div id="stage">
<canvas id="game" width="960" height="540" role="img" aria-label="Nighttail play area. Keyboard: A and D or arrows to move, Space to jump, J blade, K dart, L steal, Shift dash, Escape pause."></canvas>
<div id="hud" aria-live="off">
  <span id="hudArea">1 · The Silent Causeway</span>
  <span>Health <span class="bar"><i id="hudHp" style="width:100%"></i></span></span>
  <span>Energy <span class="bar"><i id="hudEn" style="width:100%"></i></span></span>
  <span class="grow"></span>
  <span id="hudDarts">Darts 12</span>
  <span id="hudSteal">Blade and darts</span>
</div>
<div id="overlay"><div id="panel"></div></div>
<div id="touch" hidden>
  <div class="pad">
    <button type="button" data-k="left" aria-label="Move left">Left</button>
    <button type="button" data-k="right" aria-label="Move right">Right</button>
  </div>
  <div class="acts">
    <button type="button" data-k="steal" aria-label="Steal a weapon">Steal</button>
    <button type="button" data-k="dart" aria-label="Throw a dart">Dart</button>
    <button type="button" data-k="blade" aria-label="Blade attack">Blade</button>
    <button type="button" data-k="jump" aria-label="Jump">Jump</button>
  </div>
</div>
<div id="notice" role="status"></div>
</div></div>
<script>
(function(){
"use strict";
/* Nighttail · The Hollow Crown — mechanics build 01.
   One canvas, four connected areas, blade and dart combat, weapon stealing,
   checkpoints, a boss and an ending. Built from nighttail.md. */
var W=960,H=540,FLOOR=470,STEP=1/60,SAVE_KEY="nighttail.save.v1";
var cv=document.getElementById("game"),ctx=cv.getContext("2d");
var $=function(id){return document.getElementById(id);};
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
var reduced=false;
try{reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){reduced=false;}

/* ---------- progress that survives a refresh ---------- */
var save={area:1,steals:0,deaths:0,cleared:false,effects:!reduced};
var storageOK=true;
function readSave(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return;
    var d=JSON.parse(raw);
    if(!d||typeof d!=="object")return;
    save.area=clamp(parseInt(d.area,10)||1,1,4);
    save.steals=parseInt(d.steals,10)||0;
    save.deaths=parseInt(d.deaths,10)||0;
    save.cleared=!!d.cleared;
    save.effects=d.effects!==false&&!reduced;
  }catch(e){storageOK=false;}
}
function persist(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){storageOK=false;}
}

/* ---------- the four areas ---------- */
function box(x,y,w,h){return {x:x,y:y,w:w,h:h};}
var AREAS=[
 {name:"1 · The Silent Causeway",
  tip:"Move with A/D or the arrows, jump with Space, cut with J, throw with K.",
  len:1720,exit:1640,boss:false,
  solids:[box(0,470,700,70),box(820,470,420,70),box(1300,470,420,70),box(300,356,150,18),box(860,368,130,18),box(1120,300,130,18)],
  guards:[[560,470],[1040,470],[1500,470]],flyers:[[700,250],[1260,240]]},
 {name:"2 · Ashen Cloister",
  tip:"Cut a guard down to 2 health, stand beside it and press L to steal its weapon.",
  len:1980,exit:1900,boss:false,
  solids:[box(0,470,520,70),box(620,470,380,70),box(1090,470,330,70),box(1520,470,460,70),box(420,360,150,18),box(760,340,140,18),box(1180,300,150,18),box(1420,370,140,18)],
  guards:[[380,470],[700,470],[1150,470],[1620,470]],flyers:[[900,240],[1350,250]]},
 {name:"3 · Rootbound Ossuary",
  tip:"Dash with Shift to clear the thorn gaps. Falling costs health, not progress.",
  len:2060,exit:1990,boss:false,
  solids:[box(0,470,420,70),box(560,470,300,70),box(980,470,280,70),box(1380,470,680,70),box(430,370,120,18),box(880,380,110,18),box(1290,330,120,18),box(1700,340,140,18)],
  guards:[[300,470],[640,470],[1030,470],[1450,470],[1780,470]],flyers:[[760,240],[1200,230],[1600,250]]},
 {name:"4 · The Bell Chamber",
  tip:"The Bell Warden glows before it strikes. Read the wind-up, then cut.",
  len:1200,exit:0,boss:true,
  solids:[box(0,470,1200,70),box(200,340,140,18),box(860,340,140,18)],
  guards:[[900,470]],flyers:[]}
];

/* ---------- state ---------- */
var state="title";           // title | play | paused | dead | win
var area=1,areaInfo=AREAS[0];
var cam=0,elapsed=0,frame=0,bossDefeated=false,endingStep=0;
var player=null,enemies=[],shots=[],parts=[],touches=new Set(),checkpoint=0;
var pad={left:false,right:false,jump:false,blade:false,dart:false,steal:false},edge={};
var hitId=0,damageTaken=0,paused=false;

function toast(msg,ms){
  var n=$("notice");
  n.textContent=msg;
  n.classList.add("on");
  clearTimeout(toast.t);
  toast.t=setTimeout(function(){n.classList.remove("on");},ms||2200);
}
function spark(x,y,color,n){
  if(!save.effects)return;
  for(var i=0;i<(n||6);i++){
    parts.push({x:x,y:y,vx:(Math.random()-0.5)*180,vy:-Math.random()*180,life:24,color:color});
  }
}
function makePlayer(){
  return {x:80,y:FLOOR-64,w:26,h:58,vx:0,vy:0,onGround:false,facing:1,hp:10,maxHp:10,
    energy:100,maxEnergy:100,invuln:60,dashT:0,attackT:0,dartCd:0,stealAsk:0,weapon:"Blade and darts",darts:0};
}
function spawnEnemies(){
  enemies=[];shots=[];parts=[];bossDefeated=false;
  areaInfo.guards.forEach(function(g){
    enemies.push({kind:"guard",id:++hitId,x:g[0],y:g[1]-46,w:28,h:46,hp:4,maxHp:4,vx:0,dir:-1,anim:0,hitT:0,touch:0,baseY:g[1]});
  });
  areaInfo.flyers.forEach(function(f){
    enemies.push({kind:"flyer",id:++hitId,x:f[0],y:f[1],w:30,h:26,hp:3,maxHp:3,baseY:f[1],phase:Math.random()*6,hitT:0,touch:0});
  });
  if(areaInfo.boss){
    enemies.push({kind:"warden",id:++hitId,x:760,y:358,w:96,h:112,hp:16,maxHp:16,state:"wake",t:0,hitT:0,touch:0,telegraph:0});
  }
}
function loadArea(i,keepPlayer){
  area=clamp(i,1,4);areaInfo=AREAS[area-1];
  spawnEnemies();
  if(!keepPlayer){player=makePlayer();}
  else{player.x=80;player.y=FLOOR-player.h-4;player.vx=0;player.vy=0;player.invuln=60;}
  cam=0;endingStep=0;
  $("hudArea").textContent=areaInfo.name;
  toast(areaInfo.tip,4200);
}
function solidAt(x,y,w,h){return areaInfo.solids.some(function(s){return overlap({x:x,y:y,w:w,h:h},s);});}
function groundBelow(x,w,fromY){
  var best=null;
  areaInfo.solids.forEach(function(s){
    if(x+w>s.x&&x<s.x+s.w&&s.y>=fromY-2&&(!best||s.y<best))best=s.y;
  });
  return best;
}

/* ---------- input ---------- */
var KEYMAP={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",Space:"jump",ArrowUp:"jump",KeyW:"jump",
  KeyJ:"blade",KeyZ:"blade",KeyK:"dart",KeyX:"dart",KeyL:"steal",KeyC:"steal",ShiftLeft:"dash",ShiftRight:"dash"};
function setPad(name,down){
  if(pad[name]===down)return;
  pad[name]=down;
  if(down)edge[name]=true;
  if(down&&state==="play"&&(name==="jump"||name==="blade"||name==="dart"||name==="steal"))accepted=true;
}
var accepted=false;
window.addEventListener("keydown",function(e){
  if(e.code==="Escape"){e.preventDefault();togglePause();return;}
  var k=KEYMAP[e.code];
  if(k){e.preventDefault();setPad(k,true);}
});
window.addEventListener("keyup",function(e){
  var k=KEYMAP[e.code];
  if(k){e.preventDefault();setPad(k,false);}
});
window.addEventListener("blur",function(){for(var k in pad)pad[k]=false;});
document.addEventListener("visibilitychange",function(){if(document.hidden){for(var k in pad)pad[k]=false;}});
Array.prototype.forEach.call(document.querySelectorAll("#touch button"),function(b){
  var k=b.dataset.k;
  var on=function(e){e.preventDefault();setPad(k,true);};
  var off=function(e){e.preventDefault();setPad(k,false);};
  b.addEventListener("pointerdown",on);
  b.addEventListener("pointerup",off);
  b.addEventListener("pointercancel",off);
  b.addEventListener("pointerleave",off);
});

/* ---------- combat helpers ---------- */
function bladeBox(){
  var reach=player.weapon==="Great Axe"?78:52;
  return {x:player.facing>0?player.x+player.w-4:player.x-reach+4,y:player.y+10,w:reach,h:36};
}
function swing(){
  if(player.attackT>0||player.dashT>0)return;
  player.attackT=12;player.hitIds=player.hitIds||new Set();
  var dmg=player.weapon==="Bell Hammer"?2:1;
  var b=bladeBox();
  var hits=0;
  enemies.forEach(function(e){
    if(e.dead)return;
    if(player.hitIds.has(e.id))return;
    if(overlap(b,e)){player.hitIds.add(e.id);hurtEnemy(e,dmg);hits++;}
  });
  if(hits===0)spark(b.x+b.w/2,b.y+b.h/2,"#e8b64c",3);
}
function throwDart(){
  if(player.darts<=0||player.energy<4||player.attackT>0)return;
  player.darts--;player.energy-=4;
  shots.push({x:player.x+player.w/2,y:player.y+22,w:18,h:6,vx:player.facing*560,vy:0,hostile:false,damage:1,life:90,pierce:player.weapon==="Sonic Pike"});
}
function hurtEnemy(e,dmg){
  e.hp-=dmg;e.hitT=10;
  spark(e.x+e.w/2,e.y+e.h/2,"#ffe14d",6);
  if(e.hp<=0&&e.kind!=="warden"){
    e.dead=true;
    spark(e.x+e.w/2,e.y+e.h/2,"#8f7bff",12);
  }else if(e.hp<=0&&e.kind==="warden"){
    e.hp=0;e.dead=true;bossDefeated=true;
    spark(e.x+e.w/2,e.y+e.h/2,"#ffe14d",24);
    toast("Bell Warden defeated. The way to the Archive opens.",3000);
  }
}
function stealCheck(){
  var best=null,bd=70;
  enemies.forEach(function(e){
    if(e.dead||e.kind==="warden"||e.hp>2)return;
    var d=Math.abs(e.x-player.x);
    if(d<bd){bd=d;best=e;}
  });
  if(!best){toast("Nothing to take. Weaken a guard to 2 health first.",1600);return false;}
  var drops=["Great Axe","Sonic Pike","Bell Hammer"];
  player.weapon=drops[save.steals%drops.length];
  save.steals++;persist();
  player.energy=player.maxEnergy;player.darts+=4;
  best.dead=true;
  spark(best.x+best.w/2,best.y+best.h/2,"#6ff2ff",16);
  toast("Taken: "+player.weapon+". Energy restored.",2400);
  return true;
}
function hurtPlayer(n){
  if(player.invuln>0||state!=="play")return;
  player.hp-=n;player.invuln=72;damageTaken+=n;
  spark(player.x+player.w/2,player.y+player.h/2,"#ff6b6b",10);
  if(player.hp<=0){
    player.hp=0;save.deaths++;persist();state="dead";
    showScreen("dead");
  }
}

/* ---------- update ---------- */
function update(dt){
  if(state!=="play")return;
  elapsed+=dt;frame++;
  if(player.invuln>0)player.invuln--;
  if(player.attackT>0)player.attackT--;
  if(player.dashT>0)player.dashT--;
  if(player.stealAsk>0)player.stealAsk--;
  if(player.energy<player.maxEnergy)player.energy=Math.min(player.maxEnergy,player.energy+0.14);

  /* actions: edge-triggered so one press is one action */
  if(edge.jump&&player.onGround){player.vy=-540;player.onGround=false;spark(player.x+player.w/2,player.y+player.h,"#a89fc4",4);}
  if(edge.blade||pad.blade&&frame%14===0)swing();
  if(edge.dart)throwDart();
  if(edge.steal)stealCheck();
  if(edge.dash&&player.dashT<=0&&player.energy>=22&&!player.onGround===false&&player.dashT<=0){
    player.dashT=16;player.energy-=22;player.invuln=Math.max(player.invuln,14);
    player.vx=player.facing*520;spark(player.x+player.w/2,player.y+player.h-6,"#6ff2ff",6);
  }
  if(edge.dash&&player.dashT<=0&&player.onGround&&player.energy>=22){
    player.dashT=16;player.energy-=22;player.vx=player.facing*520;
  }
  edge={};

  var speed=player.dashT>0?0:200;
  var want=(pad.right?1:0)-(pad.left?1:0);
  if(player.dashT>0){player.vx*=0.94;}
  else{
    player.vx+=(want*speed-player.vx)*0.35;
    if(want!==0)player.facing=want;
  }
  player.vy+=1500*dt;
  if(player.vy>900)player.vy=900;

  /* horizontal move, blocked by solids */
  var nx=clamp(player.x+player.vx*dt,0,areaInfo.len-player.w+120);
  if(!solidAt(nx,player.y,player.w,player.h))player.x=nx;else player.vx=0;

  /* vertical move */
  player.onGround=false;
  var ny=player.y+player.vy*dt,feet=ny+player.h;
  var floorY=groundBelow(player.x,player.w,player.y+player.h+(player.vy>0?player.vy*dt:0));
  if(player.vy>=0&&floorY!==null&&feet>=floorY){
    ny=floorY-player.h;player.vy=0;player.onGround=true;
  }
  player.y=ny;

  /* clamped to the camera window so the play area is never left */
  var left=cam+8,right=cam+W-8-player.w;
  player.x=clamp(player.x,left,right);

  /* falling into a gap costs health, not progress */
  if(player.y>H+80){
    hurtPlayerIgnoringInvuln(1);
    player.x=cam+60;player.y=FLOOR-player.h-4;player.vx=0;player.vy=0;
  }

  /* enemies */
  enemies.forEach(function(e){
    if(e.hitT>0)e.hitT--;
    if(e.touch>0)e.touch--;
    if(e.dead)return;
    if(e.kind==="guard"){
      e.anim+=dt;
      if(e.touch<=0){
        var d=player.x-e.x;
        if(Math.abs(d)<180){e.dir=d>0?1:-1;e.x+=e.dir*54*dt;e.anim+=dt*3;}
      }
      if(overlap(e,{x:bladeBox().x,y:bladeBox().y,w:bladeBox().w,h:bladeBox().h})&&e.touch<=0){/* guarded by hitIds */}
      if(e.touch<=0&&overlap(e,player)){e.touch=40;hurtPlayer(1);}
    }else if(e.kind==="flyer"){
      e.phase+=dt*2;
      e.y=e.baseY+Math.sin(e.phase)*26;
      var dx=player.x-e.x,dy=(player.y+10)-e.y,len=Math.sqrt(dx*dx+dy*dy)||1;
      if(len<340){e.x+=dx/len*70*dt;e.y+=dy/len*70*dt*0.4;}
      if(e.touch<=0&&overlap(e,player)){e.touch=50;hurtPlayer(1);}
    }else if(e.kind==="warden"){
      runWarden(e,dt);
    }
  });

  /* shots: hit the first living enemy in the way, then expire */
  shots.forEach(function(s){
    s.x+=s.vx*dt;s.life--;
    if(s.life<=0)return;
    enemies.forEach(function(e){
      if(e.dead||!overlap(s,e))return;
      hurtEnemy(e,s.damage);
      if(!s.pierce)s.life=0;
    });
    if(s.hostile&&overlap(s,player)){s.life=0;hurtPlayer(s.damage);}
    if(s.x<cam-200||s.x>cam+W+200)s.life=0;
  });
  shots=shots.filter(function(s){return s.life>0;});
  parts.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;p.life--;});
  parts=parts.filter(function(p){return p.life>0;});
  enemies=enemies.filter(function(e){return !e.dead||e.kind==="warden";});

  /* camera follows the player, clamped to the area */
  var target=clamp(player.x+player.w/2-W*0.42,0,areaInfo.len-W);
  cam+=(target-cam)*Math.min(1,dt*6);

  /* checkpoint and area exit */
  if(areaInfo.exit&&player.x+player.w>areaInfo.exit){
    if(area<4){
      save.area=area+1;persist();
      loadArea(area+1);
      toast("Checkpoint saved: "+areaInfo.name+" reached.",2200);
    }
  }
  if(areaInfo.boss&&bossDefeated&&player.x+player.w>areaInfo.len-90){
    state="win";save.cleared=true;persist();showScreen("win");
  }
  draw();
}
function hurtPlayerIgnoringInvuln(n){
  var keep=player.invuln;player.invuln=0;hurtPlayer(n);player.invuln=Math.max(player.invuln,keep);
}

/* ---------- boss ---------- */
function runWarden(e,dt){
  e.t+=dt;
  if(e.hitT>0)e.hitT--;
  var alive=enemies.filter(function(x){return !x.dead&&x.kind!=="warden";}).length;
  if(e.state==="wake"){
    if(e.t>1.4||alive===0){e.state="walk";e.t=0;}
    return;
  }
  if(e.state==="walk"){
    var d=player.x-e.x;
    e.dir=d>0?1:-1;
    e.x+=e.dir*70*dt;
    if(e.t>1.8){e.state="telegraph";e.t=0;e.telegraph=1;}
    return;
  }
  if(e.state==="telegraph"){ /* the tell: it glows, then the hammer lands */
    if(e.t>0.55){
      e.state="slam";e.t=0;
      var sx=e.x+(e.dir>0?e.w:-80);
      shots.push({x:sx,y:FLOOR-26,w:80,h:26,vx:0,vy:0,hostile:true,damage:2,life:22});
      spark(e.x+e.w/2,FLOOR-20,"#ffe14d",14);
      shake=12;
    }
    return;
  }
  if(e.state==="slam"){ if(e.t>0.5){e.state="bell";e.t=0;} return; }
  if(e.state==="bell"){ /* three slow bells, each one dodgeable */
    if(e.t>0.35&&e.t<0.4){
      shots.push({x:e.x+e.w/2-14,y:e.y+40,w:28,h:28,vx:(player.x>e.x?1:-1)*260,vy:-40,hostile:true,damage:1,life:150});
    }
    if(e.t>1.6){e.state="walk";e.t=0;}
    return;
  }
}
var shake=0;

/* ---------- drawing ---------- */
function draw(){
  var sx=0,sy=0;
  if(shake>0){sx=(Math.random()-0.5)*shake;sy=(Math.random()-0.5)*shake;shake--;}
  ctx.setTransform(1,0,0,1,0,0);
  var sky=ctx.createLinearGradient(0,0,0,H);
  if(area===1){sky.addColorStop(0,"#12101f");sky.addColorStop(1,"#241a33");}
  else if(area===2){sky.addColorStop(0,"#1a1220");sky.addColorStop(1,"#3a2420");}
  else if(area===3){sky.addColorStop(0,"#0d1a16");sky.addColorStop(1,"#20301f");}
  else{sky.addColorStop(0,"#1b1230");sky.addColorStop(1,"#3a2450");}
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  drawParallax();
  ctx.save();
  ctx.translate(-cam+sx,sy);

  areaInfo.solids.forEach(function(s){
    ctx.fillStyle="#2a2440";ctx.fillRect(s.x,s.y,s.w,s.h);
    ctx.fillStyle="#453a68";ctx.fillRect(s.x,s.y,s.w,6);
    ctx.strokeStyle="#191527";ctx.lineWidth=2;ctx.strokeRect(s.x+1,s.y+1,s.w-2,s.h-2);
  });
  if(areaInfo.exit){
    ctx.fillStyle="#e8b64c";ctx.fillRect(areaInfo.exit-6,FLOOR-120,6,120);
    ctx.fillStyle="#ffdc8a";ctx.beginPath();ctx.moveTo(areaInfo.exit,FLOOR-120);ctx.lineTo(areaInfo.exit+22,FLOOR-96);ctx.lineTo(areaInfo.exit,FLOOR-72);ctx.closePath();ctx.fill();
  }
  if(areaInfo.boss){
    ctx.fillStyle=bossDefeated?"#6ff2ff":"#3a2450";
    ctx.fillRect(areaInfo.len-90,FLOOR-150,26,150);
    ctx.fillStyle="#0f0d17";ctx.font="14px system-ui";ctx.fillText(bossDefeated?"ARCHIVE":"SEALED",areaInfo.len-150,FLOOR-160);
  }
  parts.forEach(function(p){ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);});
  enemies.forEach(function(e){
    if(e.dead&&e.kind!=="warden")return;
    var hurt=e.hitT>0;
    if(e.kind==="guard"){
      ctx.fillStyle=hurt?"#fff":"#6b5aa8";
      ctx.fillRect(e.x,e.y,e.w,e.h);
      ctx.fillStyle="#c9bfe8";ctx.fillRect(e.x+4,e.y+6,e.w-8,10);
      ctx.fillStyle=e.hp<=2?"#e8b64c":"#191527";ctx.fillRect(e.x+6,e.y+20,e.w-12,4);
    }else if(e.kind==="flyer"){
      ctx.fillStyle=hurt?"#fff":"#8f7bff";
      ctx.beginPath();ctx.ellipse(e.x+e.w/2,e.y+e.h/2,e.w/2,e.h/2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#120c30";ctx.fillRect(e.x+e.w/2-4,e.y+8,8,8);
    }else{
      ctx.fillStyle=hurt?"#ffffff":"#4a3a72";
      ctx.fillRect(e.x,e.y,e.w,e.h);
      ctx.fillStyle="#ffdc8a";ctx.fillRect(e.x+10,e.y+18,e.w-20,12);
      if(e.telegraph&&e.state==="telegraph"){
        ctx.strokeStyle="#ffe14d";ctx.lineWidth=4;ctx.strokeRect(e.x-6,e.y-6,e.w+12,e.h+12);
      }
      ctx.fillStyle="#0f0d17";ctx.fillRect(e.x-2,e.y-18,e.w+4,10);
      ctx.fillStyle="#ffe14d";ctx.fillRect(e.x-2,e.y-18,(e.w+4)*(e.hp/e.maxHp),10);
    }
  });
  shots.forEach(function(s){
    ctx.fillStyle=s.hostile?"#ff6b6b":(player.weapon==="Sonic Pike"?"#6ff2ff":"#ffe14d");
    ctx.fillRect(s.x,s.y,s.w,s.h);
  });
  if(!(player.invuln>0&&frame%8<4)){
    ctx.fillStyle="#f2eeff";
    ctx.fillRect(player.x,player.y+14,player.w,player.h-14);
    ctx.fillStyle="#2a2440";
    ctx.fillRect(player.x+(player.facing>0?player.w-8:2),player.y+18,6,6);
    ctx.fillStyle="#e8b64c";ctx.fillRect(player.x+2,player.y+2,player.w-4,12);
  }
  if(player.attackT>0){
    var b=bladeBox();
    ctx.fillStyle="#fff3c4";ctx.fillRect(b.x,b.y+10,b.w,10);
  }
  if(player.stealAsk>0){
    ctx.fillStyle="#6ff2ff";ctx.font="14px system-ui";ctx.fillText("L",player.x+player.w/2-6,player.y-10);
  }
  ctx.restore();
}
function drawParallax(){
  var off=cam*0.25;
  ctx.fillStyle="#0b0a14";
  for(var i=-1;i<8;i++){
    var x=((i*260-off)%(W+260));
    ctx.fillRect(x,300,120,240);
    ctx.fillRect(x+40,250,40,60);
  }
  var off2=cam*0.5;
  ctx.fillStyle="#1a1630";
  for(var j=-1;j<10;j++){
    var x2=((j*180-off2)%(W+180));
    ctx.fillRect(x2,380,90,160);
  }
}

/* ---------- screens ---------- */
function panelHTML(eyebrow,title,body,buttons,foot){
  var html='<p class="eyebrow">'+eyebrow+'</p><h1>'+title+'</h1>';
  body.forEach(function(b){html+="<p>"+b+"</p>";});
  html+='<div class="row">';
  buttons.forEach(function(b){
    html+='<button type="button" data-act="'+b.act+'"'+(b.cls?' class="'+b.cls+'"':"")+(b.disabled?" disabled":"")+">"+b.label+"</button>";
  });
  html+="</div>";
  if(foot)html+='<p class="foot">'+foot+"</p>";
  return html;
}
var screenButtons={};
function showScreen(name){
  var ov=$("overlay"),p=$("panel");
  if(state==="play"&&name!=="settings"){ov.hidden=true;p.innerHTML="";return;}
  ov.hidden=false;
  if(name==="title"){
    screenButtons={"Start game":startGame,"Continue":"continueRun","How to play":"howto"};
    p.innerHTML=panelHTML("Nighttail · The Hollow Crown",
      "The Hollow Crown",
      ["A monkey warrior climbs the ruined sanctuary to break the Bell Warden's hold on the Archive.",
       "Four connected areas: the Silent Causeway, the Ashen Cloister, the Rootbound Ossuary and the Bell Chamber.",
       "Progress and stolen weapons are kept on this device. No account, nothing sent anywhere."],
      [{act:"start",label:save.area>1?"Continue area "+areaNames()[save.area-1]:"Start game",cls:"primary"},
       {act:"howto",label:"How to play"},
       {act:"reset",label:"Reset progress",disabled:save.area<=1&&!save.cleared}],
      save.cleared?"You have already broken the crown. Replay any area.":"Saved progress: area "+save.area+" · stolen weapons "+save.steals+" · falls "+save.deaths);
  }else if(name==="howto"){
    p.innerHTML=panelHTML("Controls","How to play",
      ["Keyboard: A and D or the arrows move, Space jumps, J swings the blade, K throws a dart, L steals a weakened guard's weapon, Shift dashes.",
       "On a phone: the buttons at the bottom of the screen — Left, Right, Jump, Blade, Dart, Steal.",
       "Escape pauses and resumes. Steal only works on a guard you have cut down to 2 health; it restores energy and gives 4 darts.",
       "The Bell Warden glows before it slams. Move out of the way, then cut. The exit on the far right of each area is the next checkpoint."],
      [{act:"back",label:"Back to title",cls:"primary"}],null);
  }else if(name==="paused"){
    p.innerHTML=panelHTML("Paused",areaNames()[area-1],
      ["The clock and the enemies are stopped while this is open."],
      [{act:"resume",label:"Resume",cls:"primary"},{act:"restart",label:"Restart this area"},{act:"settings",label:"Settings"},{act:"title",label:"Back to title"}],null);
  }else if(name==="dead"){
    p.innerHTML=panelHTML("Fallen",areaNames()[area-1],
      ["You wake at the last checkpoint with full health. Falls here cost health, not progress."],
      [{act:"retry",label:"Get up and continue",cls:"primary"},{act:"title",label:"Back to title"}],
      "Falls so far: "+save.deaths);
  }else if(name==="win"){
    p.innerHTML=panelHTML("Ending","The Bell Warden falls",
      ["The crown shatters and the Archive answers: Mira's signal fills the chamber, clear at last.",
       "You climbed four areas without a single shortcut, and the hollow crown is only gold dust now.",
       "Stolen weapons: "+save.steals+" · times fallen: "+save.deaths+" · progress saved on this device."],
      [{act:"again",label:"Play the Bell Chamber again",cls:"primary"},{act:"title",label:"Back to title"}],null);
  }else if(name==="settings"){
    p.innerHTML=panelHTML("Settings","Settings",
      ["Reduce effects turns off particles and screen shake, for calmer play."],
      [{act:"effects",label:save.effects?"Reduce effects: on":"Reduce effects: off"},
       {act:"note",label:storageOK?"Progress saves on this device":"Progress cannot be saved here"},
       {act:"paused",label:"Back",cls:"primary"}],null);
  }
  Array.prototype.forEach.call(p.querySelectorAll("button[data-act]"),function(b){
    b.addEventListener("click",function(){act(b.dataset.act);});
  });
  accepted=true;
}
function panelHTMLWrap(){}
function areaNames(){return AREAS.map(function(a){return a.name;});}
function act(name){
  if(name==="start"||name==="continueRun")startGame();
  else if(name==="howto")showScreen("howto");
  else if(name==="back"||name==="title"){$("overlay").hidden=true;state="title";showScreen("title");}
  else if(name==="resume"||name==="paused"){$("overlay").hidden=true;state="play";}
  else if(name==="retry"){$("overlay").hidden=true;state="play";loadArea(area);}
  else if(name==="restart"){$("overlay").hidden=true;state="play";loadArea(area);}
  else if(name==="again"){$("overlay").hidden=true;state="play";loadArea(4);}
  else if(name==="settings"){showScreen("settings");}
  else if(name==="effects"){save.effects=!save.effects;persist();showScreen("settings");}
  else if(name==="reset"){save={area:1,steals:0,deaths:0,cleared:false,effects:!reduced};persist();showScreen("title");}
  else if(name==="note"){toast(storageOK?"Progress saves on this device.":"This browser blocked saving, so progress lasts this session only.",2400);}
  else if(name==="startGame"){startGame();}
}
function startGame(){
  $("overlay").hidden=true;
  loadArea(save.area||1,false);
  var touchWanted=("ontouchstart" in window)||navigator.maxTouchPoints>0;
  $("touch").hidden=!touchWanted;
  state="play";accepted=true;
}
function togglePause(){
  if(state==="play"){state="paused";showScreen("paused");}
  else if(state==="paused"){$("overlay").hidden=true;state="play";}
}
function hud(){
  $("hudHp").style.width=(player?100*player.hp/player.maxHp:100)+"%";
  $("hudEn").style.width=(player?100*player.energy/player.maxEnergy:100)+"%";
  $("hudDarts").textContent="Darts "+(player?player.darts:0);
  $("hudSteal").textContent=player?(player.weapon===undefined?"Blade and darts":player.weapon):"Blade and darts";
}

/* ---------- loop ---------- */
var last=0,acc=0,STEP=1/60;
function frameLoop(now){
  raf=requestAnimationFrame(frameLoop);
  if(!last)last=now;
  var dt=(now-last)/1000;last=now;
  if(dt>0.25)dt=0.25;
  if(state==="play"){
    acc+=dt;
    while(acc>=STEP){update(STEP);acc-=STEP;}
  }
  hud();
  draw();
}
function startLoop(){
  if(!raf){last=0;raf=requestAnimationFrame(frameLoop);}
}
function stopLoop(){
  if(raf){cancelAnimationFrame(raf);raf=0;last=0;acc=0;}
}
function syncLoop(){
  if(document.hidden||state==="title"&&$("overlay").hidden===false&&!player)stopLoop();
  else if(document.hidden||state==="paused")stopLoop();
  else startLoop();
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){for(var k in pad)pad[k]=false;stopLoop();}
  else syncLoop();
});

/* ---------- init ---------- */
/* Touch controls only appear on a device that has a touch pointer. */
function buildTouch(){
  var t=$("touch");
  var coarse=("ontouchstart" in window)||navigator.maxTouchPoints>0||window.matchMedia("(pointer:coarse)").matches;
  t.hidden=!coarse;
}
function init(){
  reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  readSave();
  canvas.setAttribute("width",W);canvas.setAttribute("height",H);
  $("overlay").hidden=false;
  state="title";
  buildTouch();
  showScreen("title");
  document.addEventListener("keydown",function(e){
    if(e.code==="Escape"&&(state==="play"||state==="paused")){e.preventDefault();togglePause();}
  });
  canvas.addEventListener("pointerdown",function(){if(state==="play")canvas.focus();});
  window.addEventListener("resize",function(){canvas.setAttribute("width",W);canvas.setAttribute("height",H);});
  startLoop();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();
</script>
