const SEED='banana_signal_v2',SETTINGS='banana_signal_settings_v2';let storageOK=true;

const DIFFICULTY={story:{hp:1.5,damage:.6,speed:.85,retries:5,label:'STORY'},hard:{hp:1,damage:1,speed:1,retries:2,label:'HARD'},nightmare:{hp:.8,damage:1.6,speed:1.18,retries:0,label:'NIGHTMARE'}};const diff=()=>DIFFICULTY[game.difficulty||settings.difficulty];

function upgradeCost(item,level){return Math.round(item.base*Math.pow(1.65,level))}function purchase(data,key){const item=upgrades.find(u=>u.key===key);if(!item)return false;const level=data.upgrades[key],cost=upgradeCost(item,level);if(level>=5||data.bananas<cost)return false;data.bananas-=cost;data.upgrades[key]++;return true}
function persist(){writeJSON(SEED,save)}let noticeTimer;function notify(text){$('notice').textContent=text;$('notice').style.opacity=1;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').style.opacity=0,2600)}
const stages=[
{name:'PRISM HOLLOW',boss:'CARAPACE-IX',kind:'beetle',color:'#a776ff',sky:'#1b1b40',pattern:'fan',text:'The caravan seed-vault is failing. Kip must reopen eight climate relays before the last living orchard freezes. A beetle siege engine nests in the crystal mine.'},
{name:'SCRAP CANOPY',boss:'IRON KONG',kind:'gorilla',color:'#77c7a3',sky:'#0c2830',pattern:'slam',text:'Steel vines feed an abandoned salvage garden. Iron Kong hoards its soil filters. Mechanic Nori needs those filters, not another trophy.'},
{name:'TIDAL CIRCUIT',boss:'MANTA COIL',kind:'drone',color:'#66d9f2',sky:'#102945',pattern:'wave',text:'The pumps are drowning the lower decks. A floating sentinel mistakes the caravan for a flood. Shut its coils down without destroying the freshwater reserve.'},
{name:'EMBER FOUNDRY',boss:'CINDER MANTIS',kind:'wasp',color:'#ff975d',sky:'#351c30',pattern:'dash',text:'Seed sterilizers have become furnaces. Cinder Mantis obeys orders from Warden Oryx: no harvest outside the citadel. Take back the heat exchanger.'},
{name:'SKY GLASS',boss:'VESPA REGENT',kind:'wasp',color:'#a3d4ff',sky:'#233556',pattern:'rain',text:'Cross the suspension bridges and claim a wind relay. Vespa Regent commands the courier swarm that once carried pollen between cities.'},

const storyStart=['KIP // DAWN CARAVAN','A hundred traveling families carry the last seeds of their old home. Their destination is a living orchard behind the citadel walls. Warden Oryx has sealed it.','Kip, a salvage-runner with a patched teal suit and a prism saber, volunteers to reopen eight climate relays. Nori will keep the caravan moving.','Every guardian controls something the families need: clean water, warmth, soil, wind. The job is not revenge. It is a harvest.'];
const game={state:'menu',stage:1,cam:0,time:0,total:0,shake:0,freeze:0,boss:null,checkpoint:40,retries:2,kills:0,clearing:false,checkpointNotice:0};let player=null,level=null,enemies=[],shots=[],loot=[],effects=[],floating=[],tick=0;

const keymap={left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],jump:['Space','KeyZ','ArrowUp'],slash:['KeyX','KeyJ'],dash:['ShiftLeft','ShiftRight','KeyC'],shot:['KeyV','KeyK'],pause:['Escape','KeyP'],shop:['KeyB']};
function resetInput(){for(const k in keys)delete keys[k];touches.clear();input={};previous={};document.querySelectorAll('[data-action]').forEach(b=>b.classList.remove('pressed'))}function pressed(k){return input[k]&&!previous[k]}
function getPadState(gp){const b=i=>!!gp.buttons[i]?.pressed,x=gp.axes[0]||0;return {left:x<-.24||b(14),right:x>.24||b(15),jump:b(0),dash:b(1)||b(5),slash:b(2),shot:b(3)||b(7),shop:b(4)||b(8),pause:b(9),up:(gp.axes[1]||0)<-.5||b(12),down:(gp.axes[1]||0)>.5||b(13)}}
function pollInput(){previous={...input};let gp;try{gp=Array.from(navigator.getGamepads?.()||[]).find(p=>p&&p.connected&&p.mapping==='standard')}catch(e){}pad=gp?getPadState(gp):{};if(gp&&padID!==gp.id){padID=gp.id;notify('Controller ready: A jump · X slash · B dash · Y bolt')}if(!gp)padID='';for(const a in keymap)input[a]=keymap[a].some(k=>keys[k])||[...touches.values()].includes(a)||!!pad[a];if(game.state!=='play'){const buttons=[...$('panel').querySelectorAll('button:not(:disabled),select,input')];const nav=(pad.down&&!padNav.down)||(pad.right&&!padNav.right)?1:(pad.up&&!padNav.up)||(pad.left&&!padNav.left)?-1:0;if(nav&&buttons.length){const i=buttons.indexOf(document.activeElement);buttons[(i+nav+buttons.length)%buttons.length].focus()}if(pad.jump&&!padNav.jump&&document.activeElement?.tagName==='BUTTON')document.activeElement.click();if(pad.dash&&!padNav.dash){const back=$('panel').querySelector('[data-back]');if(back)back.click()}}padNav={...pad}}
addEventListener('keydown',e=>{if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)&&game.state==='play')e.preventDefault();keys[e.code]=true;if(e.code==='Enter'&&game.state==='menu')$('panel').querySelector('button.primary')?.click()});addEventListener('keyup',e=>delete keys[e.code]);addEventListener('blur',()=>{resetInput();if(game.state==='play')pauseMenu()});document.addEventListener('visibilitychange',()=>{if(document.hidden){resetInput();if(game.state==='play')pauseMenu();persist()}});

const audio={ctx:null,master:null,music:null,sfx:null,next:0,step:0,start(){try{if(!this.ctx){this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.music=this.ctx.createGain();this.sfx=this.ctx.createGain();this.music.connect(this.master);this.sfx.connect(this.master);this.master.connect(this.ctx.destination);this.apply();this.next=this.ctx.currentTime}if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})}catch(e){}},apply(){if(!this.ctx)return;this.master.gain.value=settings.volume;this.music.gain.value=settings.music*.18;this.sfx.gain.value=settings.sfx*.22},tone(freq,duration,type='square',vol=.3,music=false,slide=0){if(!this.ctx||this.ctx.state!=='running')return;const o=this.ctx.createOscillator(),g=this.ctx.createGain(),t=this.ctx.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+duration);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(music?this.music:this.sfx);o.onended=()=>{o.disconnect();g.disconnect()};o.start(t);o.stop(t+duration+.01)},fx(name){const f={jump:[320,.12,650],dash:[170,.1,80],slash:[950,.09,110],hit:[170,.1,55],shot:[700,.1,190],banana:[760,.08,1200],death:[250,.6,35],win:[520,.4,1040],buy:[420,.2,840],warn:[180,.2,160]}[name]||[440,.1,0];this.tone(f[0],f[1],name==='banana'?'triangle':'square',.4,false,f[2])},update(){if(!this.ctx||this.ctx.state!=='running')return;const now=this.ctx.currentTime;if(now<this.next)return;const boss=!!game.boss&&!game.boss.dead,rate=boss?.095:.14;this.next=now+rate;const scale=[0,3,7,10,7,5,3,7],root=game.state==='play'?98+game.stage*5:110,n=scale[this.step%8];this.tone(root*Math.pow(2,n/12),rate*.8,'triangle',.4,true);if(this.step%2===0)this.tone(root*4*Math.pow(2,scale[(this.step+2)%8]/12),rate*.6,'square',.1,true);this.step++}};

function seedRng(seed){return()=>{seed=(seed+0x6d2b79f5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}
function makeLevel(n){const rng=seedRng(2026+n*153),L={width:n===9?3400:7100+n*120,solids:[],platforms:[],hazards:[],checkpoints:[],decor:[]};L.arena=L.width-460;for(let x=0;x<L.width;){const end=Math.min(x+400,L.width),gap=x>400&&x<L.arena-500&&rng()<.32?56:0;L.solids.push({x,y:GROUND,w:end-x-gap,h:80});if(gap)L.decor.push({x:end-gap,y:GROUND,kind:'pit'});x=end}L.solids.push({x:L.arena-240,y:GROUND,w:700,h:80},{x:-24,y:0,w:24,h:400},{x:L.width,y:0,w:24,h:400});for(let x=360;x<L.arena-300;x+=240){const y=GROUND-56-Math.floor(rng()*2)*40;L.platforms.push({x,y,w:88,h:10});if(rng()<.6)L.platforms.push({x:x+94,y:y-50,w:64,h:10});if(x%720===360)L.hazards.push({x:x+110,y:GROUND-10,w:26,h:10});L.decor.push({x:x+30,y:GROUND,kind:rng()<.5?'crystal':'console'})}for(let x=2080;x<L.arena-500;x+=2080)L.checkpoints.push({x,y:GROUND-32,w:24,h:32,active:false});return L}
function makeEnemy(type,x,y,n){const gorilla=type==='gorilla';return{type,x,y,w:gorilla?28:22,h:gorilla?30:type==='wasp'?18:22,home:x,baseY:y,vx:0,vy:0,face:-1,hp:(gorilla?28:type==='turret'?20:14)+n,maxHp:(gorilla?28:type==='turret'?20:14)+n,t:x%3,cool:1,hit:0,dead:false,ground:false}}
function launch(n){game.difficulty=settings.difficulty;game.stage=n;save.stage=n;persist();level=makeLevel(n);game.state='play';game.time=0;game.cam=0;game.boss=null;game.checkpoint=40;game.retries=diff().retries;game.kills=0;game.clearing=false;game.freeze=0;enemies=[];shots=[];loot=[];effects=[];floating=[];player=makePlayer(40);const kinds=['beetle','wasp','turret','gorilla'];for(let x=440;x<level.arena-260;x+=180){const type=kinds[(Math.floor(x/180)+n)%4];enemies.push(makeEnemy(type,x,type==='wasp'?GROUND-110:GROUND-(type==='gorilla'?30:22),n));if(x%3===0)loot.push({x:x+12,y:GROUND-85,w:10,h:10,v:2,vy:0,ground:true})}resetInput();hideOverlay();updateControls();audio.step=0;notify(stages[n-1].name+' · '+diff().label)}
function move(body,dt,oneWay=true){body.ground=false;body.wall=0;body.x+=body.vx*dt;for(const s of level.solids)if(overlap(body,s)){if(body.vx>0){body.x=s.x-body.w;body.wall=1}else if(body.vx<0){body.x=s.x+s.w;body.wall=-1}body.vx=0}const oldBottom=body.y+body.h;body.y+=body.vy*dt;for(const s of level.solids)if(overlap(body,s)){if(body.vy>=0&&oldBottom<=s.y+4){body.y=s.y-body.h;body.ground=true}else if(body.vy<0)body.y=s.y+s.h;body.vy=0}if(oneWay&&body.vy>=0)for(const s of level.platforms)if(oldBottom<=s.y+1&&body.y+body.h>=s.y&&body.x+body.w>s.x&&body.x<s.x+s.w){body.y=s.y-body.h;body.vy=0;body.ground=true}}
function burst(x,y,color,count=9){for(let i=0;i<count;i++)effects.push({x,y,vx:(Math.random()-.5)*120,vy:-Math.random()*110,life:.35+Math.random()*.3,color})}function text(x,y,value,color='#ffe06a'){floating.push({x,y,value,color,life:.8})}
function hurtPlayer(amount){if(!player||player.dead||player.inv>0||game.state!=='play')return;const damage=Math.max(1,Math.round(amount*diff().damage));player.hp=Math.max(0,player.hp-damage);player.inv=.85;player.vx=-player.face*90;game.shake=5;audio.fx('hit');text(player.x,player.y-8,'−'+damage,'#ff8a94');if(player.hp<=0)die()}
function die(){if(player.dead)return;player.dead=true;player.deathTime=1.1;save.deaths++;game.retries--;persist();burst(player.x+9,player.y+15,'#73efff',24);audio.fx('death')}
function dropBananas(x,y,value){loot.push({x,y,w:10,h:10,v:value,vy:-90,ground:false})}function damageEnemy(e,damage){if(e.dead)return;e.hp-=damage;e.hit=.1;text(e.x,e.y-5,damage);audio.fx('hit');if(e.hp<=0){e.dead=true;save.kills++;game.kills++;dropBananas(e.x,e.y,e.type==='gorilla'?6:e.type==='turret'?5:3);burst(e.x+10,e.y+10,'#f6b06d');persist()}}
function slashBox(){const reach=28+save.upgrades.blade*2+(player.combo===3?8:0);return{x:player.face>0?player.x+10:player.x-reach+8,y:player.y-3,w:reach,h:37}}
function firePlayer(charge){const tier=charge>.9?2:charge>.3?1:0;shots.push({x:player.x+(player.face>0?18:-6),y:player.y+11,w:6+tier*5,h:4+tier*3,vx:player.face*(250+tier*45),vy:0,life:2,friendly:true,damage:5+save.upgrades.bolt*2+tier*6,tier});audio.fx('shot')}
function updatePlayer(dt){const p=player;if(p.dead){p.deathTime-=dt;if(p.deathTime<=0){if(game.retries<0){gameOver();return}player=makePlayer(game.checkpoint);shots=[];if(game.boss&&!game.boss.dead){game.boss=null;game.cam=Math.max(0,game.checkpoint-100)}notify('Checkpoint restored · '+game.retries+' retries remaining')}return}p.inv=Math.max(0,p.inv-dt);p.attack=Math.max(0,p.attack-dt);p.comboTime=Math.max(0,p.comboTime-dt);p.dashCD=Math.max(0,p.dashCD-dt);p.shotCD=Math.max(0,p.shotCD-dt);p.en=Math.min(p.maxEn,p.en+dt*19);const direction=Number(!!input.right)-Number(!!input.left);if(p.ground){p.jumps=0;p.airDash=false}if(pressed('jump')&&(p.jumps<2||p.wall)){p.vy=-235;p.jumps++;if(p.wall){p.vx=-p.wall*145;p.face=-p.wall}audio.fx('jump')}if(!input.jump&&p.vy<-90)p.vy+=650*dt;if(pressed('dash')&&p.dashCD<=0&&p.en>=18&&(p.ground||!p.airDash)){if(direction)p.face=direction;p.dash=.16;p.dashCD=.36;p.en-=18;if(!p.ground)p.airDash=true;audio.fx('dash')}if(p.dash>0){p.dash-=dt;p.vx=p.face*290;p.vy=0;p.inv=Math.max(p.inv,.04);if(tick%3===0)effects.push({x:p.x,y:p.y+15,vx:0,vy:0,life:.18,color:'#79f7ed'})}else{p.vx+=(direction*118-p.vx)*Math.min(1,dt*16);if(direction)p.face=direction;p.vy=Math.min(390,p.vy+620*dt)}if(input.slash&&p.attack<=0){p.combo=p.comboTime>0?p.combo%3+1:1;p.comboTime=.55;p.attack=p.combo===3?.27:.19;p.hitSet.clear();p.attackID++;audio.fx('slash')}if(input.shot){p.charge=Math.min(1.5,p.charge+dt*(1+save.upgrades.energy*.12))}else if(previous.shot&&p.shotCD<=0){firePlayer(p.charge);p.charge=0;p.shotCD=.14}else if(!input.shot)p.charge=0;move(p,dt);p.x=clamp(p.x,game.boss?level.arena:0,level.width-p.w);if(p.y>H+60){p.inv=0;die();return}for(const h of level.hazards)if(overlap(p,h)){hurtPlayer(10);p.vy=-140}if(p.attack>0){const box=slashBox();for(const e of enemies)if(!e.dead&&!p.hitSet.has(e)&&overlap(box,e)){p.hitSet.add(e);damageEnemy(e,8+save.upgrades.blade*2+(p.combo===3?4:0));game.freeze=.025}if(game.boss&&!game.boss.dead&&!p.hitSet.has(game.boss)&&over function enemyShot(e,speed=105,angle=null){const a=angle??Math.atan2(player.y+12-e.y,player.x+9-e.x);shots.push({x:e.x+e.w/2,y:e.y+e.h/2,w:6,h:6,vx:Math.cos(a)*speed*diff().speed,vy:Math.sin(a)*speed*diff().speed,life:4,friendly:false,damage:6})}
function updateEnemies(dt){for(const e of enemies){if(e.dead||Math.abs(e.x-player.x)>650)continue;e.t+=dt;e.cool-=dt;e.hit=Math.max(0,e.hit-dt);e.face=player.x>e.x?1:-1;if(e.type==='wasp'){e.x+=Math.sin(e.t)*18*dt;e.y=e.baseY+Math.sin(e.t*4)*16;if(e.cool<=0&&Math.abs(e.x-player.x)<270){enemyShot(e);e.cool=2.2/diff().speed}}else{e.vy=Math.min(390,e.vy+620*dt);if(e.type==='gorilla'){e.vx=Math.abs(player.x-e.x)<210?e.face*34:0;if(e.ground&&e.cool<=0){e.vy=-180;e.vx=e.face*75;e.cool=2}}else if(e.type==='beetle')e.vx=Math.cos(e.t)*28;else if(e.cool<=0&&Math.abs(e.x-player.x)<290){enemyShot(e,130);e.cool=1.7/diff().speed}move(e,dt);if(e.y>H+100)e.dead=true}if(!e.dead&&overlap(player,e))hurtPlayer(e.type==='gorilla'?11:7)}}
function spawnBoss(){shots=[];enemies=enemies.filter(e=>e.x<level.arena-100);const s=stages[game.stage-1];game.boss={x:level.width-115,y:GROUND-52,w:46,h:52,hp:190+game.stage*24,maxHp:190+game.stage*24,phase:1,state:'intro',timer:1.5,fire:0,pattern:s.pattern,action:s.pattern,face:-1,hit:0,dead:false,deathTime:1.8,sequence:0,lockedX:player.x,warning:''};game.checkpoint=level.arena-100;notify(s.boss+' · read the wind-up, then strike');audio.fx('warn')}
function damageBoss(amount){const b=game.boss;if(!b||b.dead||b.state==='intro')return;b.hp=Math.max(0,b.hp-amount);b.hit=.1;text(b.x+20,b.y,amount);audio.fx('hit');if(b.hp<=0){b.dead=true;shots=shots.filter(s=>s.friendly);game.shake=8;burst(b.x+23,b.y+26,'#c3ffff',40);audio.fx('win');save.bananas+=75+game.stage*15;persist();notify('Guardian defeated · +'+(75+game.stage*15)+' bananas')}else if(b.hp<b.maxHp*.5&&b.phase===1){b.phase=2;b.state='tell';b.timer=1.1;b.warning='OVERCLOCK';b.action='ring';b.fire=0;notify(stages[game.stage-1].boss+' · OVERCLOCK PHASE')}}
function bossProjectile(b,angle,speed=115,damage=8,w=7,h=7){shots.push({x:b.x+b.w/2,y:b.y+20,w,h,vx:Math.cos(angle)*speed*diff().speed,vy:Math.sin(angle)*speed*diff().speed,damage,friendly:false,life:4,boss:true})}
function chooseBossAction(b){const patterns=[b.pattern,'fan',b.pattern,'ring',b.pattern,'dash'];b.action=patterns[b.sequence++%patterns.length];if(b.action==='all')b.action=['fan','rain','slam','ring','blink'][b.sequence%5];b.state='tell';b.timer=(b.phase===2?.55:.8)/diff().speed;b.lockedX=player.x;b.face=player.x>b.x?1:-1;b.warning={fan:'PRISM FAN',slam:'GROUND BREAK',wave:'TIDAL PULSE',dash:'BLADE RUSH',rain:'SKY FALL',blink:'PHASE SHIFT',ring:'RING BURST'}[b.action]||'CHARGING';b.fire=0}
function updateBoss(dt){const b=game.boss;if(!b)return;if(b.dead){b.deathTime-=dt;if(b.deathTime<=0&&!game.clearing){game.clearing=true;clearStage()}return}b.hit=Math.max(0,b.hit-dt);b.timer-=dt;b.face=player.x>b.x?1:-1;if(b.state==='intro'){if(b.timer<=0){b.state='rest';b.timer=.6}return}if(b.state==='rest'){if(b.timer<=0)chooseBossAction(b)}else if(b.state==='tell'){if(b.timer<=0){b.state='attack';b.dashFace=b.face;b.timer=b.action==='dash'?.65:1.2;b.fire=0;if(b.action==='blink'){b.x=clamp(b.lockedX+80,level.arena+12,level.width-62);burst(b.x,b.y,'#c3a0ff',10)}}}else if(b.state==='attack'){b.fire-=dt;if(b.action==='dash')b.x+=b.dashFace*(b.phase===2?185:145)*dt;else if(b.action==='slam'){b.y=GROUND-b.h-Math.sin(Math.PI*clamp((1.2-b.timer)/1.2,0,1))*88;if(b.timer<=.08&&b.fire<=0){b.fire=9;game.shake=7;for(const dir of [-1,1])shots.push({x:b.x+23,y:GROUND-10,w:16,h:10,vx:dir*170*diff().speed,vy:0,life:3,friendly:false,damage:10,boss:true})}}else if(b.fire<=0){b.fire=b.phase===2?.26:.4;const aim=Math.atan2(player.y+12-(b.y+20),player.x+9-(b.x+23));switch(b.action){case 'ring':for(let i=0;i<10;i++)bossProjectile(b,i*Math.PI/5+tick*.001,96);b.fire=2;break;case 'rain':shots.push({x:clamp(b.lockedX+Math.sin(b.timer*9)*52,level.arena,level.width-12),y:35,w:9,h:21,vx:0,vy:190*diff().speed,life:3,friendly:false,damage:9,boss:true});break;case 'wave':bossProjectile(b,aim-.2,120);bossProjectile(b,aim+.2,120);break;case 'blink':bossProjectile(b,aim,155,9,12,7);break;default:for(let i=-1;i<=1;i++)bossProjectile(b,aim+i*.26,120)}}if(b.timer<=0){b.state='rest';b.timer=b.phase===2?.65:1.05;b.y=GROUND-b.h}}b.x=clamp(b.x,level.arena+8,level.width-b.w-8);if(overlap(player,b))hurtPlayer(b.state==='attack'?12:8)}
function updateShots(dt){for(let i=shots.length-1;i>=0;i--){const b=shots[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let gone=b.life<=0||b.x<-20||b.x>level.width+20||b.y>H+30;if(!gone&&b.friendly){for(const e of enemies)if(!e.dead&&overlap(e,b)){damageEnemy(e,b.damage);gone=true;break}if(!gone&&game.boss&&!game.boss.dead&&overlap(b,game.boss)){damageBoss(b.damage);gone=true}}else if(!gone&&!player.dead&&overlap(b,player)){hurtPlayer(b.damage);gone=true}if(!gone&&level.solids.some(s=>overlap(b,s)))gone=true;if(gone)shots.splice(i,1)}}
function updateLoot(dt){for(let i=loot.length-1;i>=0;i--){const l=loot[i],dx=player.x+9-l.x,dy=player.y+15-l.y,d=Math.hypot(dx,dy);if(d<24+save.upgrades.magnet*22&&!player.dead){l.x+=dx*dt*9;l.y+=dy*dt*9}else if(!l.ground){const oldBottom=l.y+l.h;l.vy+=320*dt;l.y+=l.vy*dt;for(const s of level.solids)if(l.vy>0&&oldBottom<=s.y+3&&l.y+l.h>=s.y&&l.x+l.w>s.x&&l.x<s.x+s.w){l.y=s.y-l.h;l.vy=0;l.ground=true;break}}if(!player.dead&&overlap(player,l)){save.bananas+=l.v;audio.fx('banana');text(l.x,l.y,'+'+l.v+' BAN');loot.splice(i,1);persist()}else if(l.y>H+120)loot.splice(i,1)}}
function updateFX(dt){for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life-=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=160*dt;if(e.life<=0)effects.splice(i,1)}for(let i=floating.length-1;i>=0;i--){floating[i].life-=dt;floating[i].y-=18*dt;if(floating[i].life<=0)floating.splice(i,1)}}
function update(dt){if(pressed('pause')){if(game.state==='play')pauseMenu();else if(game.state==='pause')resume()}if(pressed('shop')&&game.state==='play')shop('pause');if(game.state!=='play')return;save.time+=dt;game.time+=dt;game.total+=dt;if(game.freeze>0){game.freeze-=dt;return}updatePlayer(dt);if(game.state!=='play')return;if(!player.dead){updateEnemies(dt);updateBoss(dt);updateShots(dt);updateLoot(dt)}updateFX(dt);game.cam=clamp(player.x-140,0,level.width-W);if(game.boss&&!game.boss.dead)game.cam=level.width-W;if(Math.floor(game.total/5)!==Math.floor((game.total-dt)/5))persist()}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clock(seconds){const m=Math.floor(seconds/60);return m+':'+String(Math.floor(seconds%60)).padStart(2,'0')}
function setPanel(title,body,actions,state='menu'){game.state=state;$('panel').innerHTML=(title?'<h2>'+title+'</h2>':'')+body+'<div class="actions">'+actions.map((a,i)=>'<button id="action'+i+'" class="'+(a.kind||'')+'" '+(a.back?'data-back ':'')+(a.disabled?'disabled':'')+'>'+a.label+'</button>').join('')+'</div>';$('overlay').hidden=false;$('top').hidden=true;$('touch').hidden=true;actions.forEach((a,i)=>$('action'+i).onclick=()=>{audio.start();a.run()});const button=$('panel').querySelector('button:not(:disabled)');if(button)button.focus();resetInput()}
function hideOverlay(){$('overlay').hidden=true;$('top').hidden=false;updateControls()}function updateControls(){$('touch').hidden=game.state!=='play'||settings.touch==='off'||(settings.touch==='auto'&&!matchMedia('(pointer:coarse)').matches&&navigator.maxTouchPoints<1)}
function menu(){persist();setPanel('','<div class="menu-layout"><div class="menu-copy"><div class="eyebrow">CARAVAN ARCHIVE // ORIGINAL PIXEL ACTION</div><h1>BANANA<br><span>SIGNAL</span></h1><div class="subtitle">DAWN CARAVAN</div><p>A monkey. A prism saber. Eight stolen seasons.</p><div class="statline"><span>◆ '+save.bananas+' BAN</span><span>RELAYS '+save.cleared.filter(n=>n<=8).length+'/8</span><span>'+clock(save.time)+'</span></div><div class="menu-actions"><button id="continue" class="primary">CONTINUE // RELAY '+save.stage+'</button><button id="new">NEW CAMPAIGN</button><button id="stages">STAGE SELECT</button><button id="upgrades" class="gold">WORKSHOP</button><button id="help">CONTROLS</button><button id="settings" class="wide">SETTINGS</button></div><p id="controller">KEYBOARD · TOUCH · STANDARD GAMEPAD</p><p class="rotate-hint">ROTATE TO LANDSCAPE FOR THE BEST VIEW</p></div><div class="menu-art"><canvas id="heroArt" width="240" height="240" aria-label="Kip, prism saber runner"></canvas></div></div>',[],'menu');$('continue').onclick=()=>{audio.start();intro(save.stage)};$('new').onclick=()=>{audio.start();newCampaign()};$('stages').onclick=stageSelect;$('upgrades').onclick=()=>shop('menu');$('help').onclick=()=>help('menu');$('settings').onclick=()=>settingsMenu('menu');drawMenuArt();if(!storageOK)notify('Storage unavailable. Progress lasts only while this page stays open.')}
function newCampaign(){setPanel('NEW CAMPAIGN','<p>Start from relay 1 with zero bananas and upgrades?</p><p class="muted">This replaces the campaign saved in this browser. Settings are kept.</p>',[{label:'BEGIN',kind:'primary',run:()=>{save=defaults();persist();story(storyStart,()=>intro(1))}},{label:'CANCEL',back:true,run:menu}])}

function intro(n){const s=stages[n-1];setPanel((n===9?'FINAL SIGNAL':'RELAY '+n+' / 8')+' · '+s.name,'<p>'+s.text+'</p><div class="card"><h3>GUARDIAN // '+s.boss+'</h3><p class="muted">Watch the amber wind-up. Dash to evade; strike during recovery. Bananas and upgrades survive defeat.</p></div><p class="muted">'+diff().label+' · '+diff().retries+' checkpoint retries · double jump · one air dash</p>',[{label:'DEPLOY',kind:'primary',run:()=>launch(n)},{label:'UPGRADES',kind:'gold',run:()=>shop('intro',n)},{label:'BACK',back:true,run:stageSelect}],'intro')}
function stageSelect(){setPanel('RELAY ATLAS','<div class="eyebrow">MISSION CONTROL // EIGHT STOLEN SEASONS</div><p class="muted">Repair eight relays to unlock the Dawn Engine. Cleared sectors can be replayed for bananas.</p><canvas id="routeArt" width="640" height="110" style="width:100%;height:auto;margin:10px 0" aria-label="Campaign route map"></canvas><div class="grid">'+stages.map((s,i)=>'<div class="card" style="border-top:3px solid '+s.color+'"><span class="stage-no">'+String(i+1).padStart(2,'0')+'</span><div class="eyebrow">'+(i+1>save.unlocked?'OFFLINE':save.cleared.includes(i+1)?'RESTORED':'SIGNAL FOUND')+'</div><h3>'+s.name+'</h3><p class="muted">GUARDIAN // '+s.boss+'</p><button data-stage="'+(i+1)+'" '+(i+1>save.unlocked?'disabled':'')+'>'+(i+1>save.unlocked?'LOCKED':save.cleared.includes(i+1)?'REPLAY SECTOR':'DEPLOY RUNNER')+'</button>'+(save.best[i+1]?'<p class="muted">BEST '+clock(save.best[i+1])+'</p>':'')+'</div>').join('')+'</div>',[{label:'BACK TO BASE',back:true,run:menu}]);drawRoute();document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{audio.start();intro(Number(b.dataset.stage))})}
function pauseMenu(){if(game.state!=='play')return;persist();setPanel('SIGNAL HELD','<p>'+stages[game.stage-1].name+' · '+clock(game.time)+'</p><p class="goldText">BANANAS '+save.bananas+'</p>',[{label:'RESUME',kind:'primary',back:true,run:resume},{label:'UPGRADES',kind:'gold',run:()=>shop('pause')},{label:'SETTINGS',run:()=>settingsMenu('pause')},{label:'CONTROLS',run:()=>help('pause')},{label:'RESTART STAGE',run:()=>restartConfirm()},{label:'MAIN MENU',run:menu}],'pause')}
function resume(){game.state='play';resetInput();hideOverlay();audio.start()}function backTo(where,n){if(where==='pause'){game.state='play';pauseMenu()}else if(where==='intro')intro(n);else menu()}
function restartConfirm(){setPanel('RESTART STAGE?','<p>Stage position and retries reset. Collected bananas and purchased upgrades are kept.</p>',[{label:'RESTART',kind:'primary',run:()=>launch(game.stage)},{label:'CANCEL',back:true,run:()=>backTo('pause')}],'pause')}
function shop(where,n){setPanel('BANANA WORKSHOP','<p class="goldText">BALANCE '+save.bananas+' BANANAS</p><p class="muted">Robot salvage earns bananas from the caravan trading network. Pick up yellow bananas before leaving a stage. Upgrades persist through retries and defeat.</p><div class="grid">'+upgrades.map(u=>{const lv=save.upgrades[u.key],cost=upgradeCost(u,lv);return'<div class="card"><h3>'+u.name+' '+lv+'/5</h3><p class="muted">'+u.desc+'</p><button data-buy="'+u.key+'" '+(lv>=5||save.bananas<cost?'disabled':'')+'>'+(lv>=5?'MAXED':'UPGRADE · '+cost+' BAN')+'</button></div>'}).join('')+'</div>',[{label:'BACK',back:true,kind:'primary',run:()=>backTo(where,n)}],'shop');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{if(!purchase(save,b.dataset.buy)){audio.fx('warn');return}if(player){const old=player.maxHp;player.maxHp=Math.round((36+save.upgrades.armor*6)*diff().hp);player.hp=Math.min(player.maxHp,player.hp+Math.max(0,player.maxHp-old));player.maxEn=100+save.upgrades.energy*15;player.en=Math.min(player.maxEn,player.en+15)}persist();audio.fx('buy');shop(where,n)})}
function settingsMenu(where){setPanel('SETTINGS','<div class="row"><label for="volume">Master volume</label><input id="volume" type="range" min="0" max="100" value="'+settings.volume*100+'"></div><div class="row"><label for="music">Music</label><input id="music" type="range" min="0" max="100" value="'+settings.music*100+'"></div><div class="row"><label for="sfx">Effects</label><input id="sfx" type="range" min="0" max="100" value="'+settings.sfx*100+'"></div><div class="row"><label for="difficulty">Difficulty (next stage)</label><select id="difficulty"><option value="story">STORY</option><option value="hard">HARD</option><option value="nightmare">NIGHTMARE</option></select></div><div class="row"><label for="touchSetting">Touch controls</label><select id="touchSetting"><option value="auto">AUTOMATIC</option><option value="on">ALWAYS ON</option><option value="off">OFF</option></select></div><div class="row"><label for="shake">Screen shake</label><input id="shake" type="checkbox" '+(settings.shake?'checked':'')+'></div><p class="muted">Save is local to this browser and origin. Clearing browser data removes it. No account, network assets, or purchases are required.</p>',[{label:'BACK',back:true,kind:'primary',run:()=>backTo(where)}],'settings');$('difficulty').value=settings.difficulty;$('touchSetting').value=settings.touch;const store=()=>{writeJSON(SETTINGS,settings);audio.apply()};for(const k of ['volume','music','sfx'])$(k).oninput=e=>{settings[k]=Number(e.target.value)/100;store();if(k==='sfx')audio.fx('banana')};$('difficulty').onchange=e=>{settings.difficulty=e.target.value;store()};$('touchSetting').onchange=e=>{settings.touch=e.target.value;store()};$('shake').onchange=e=>{settings.shake=e.target.checked;store()}}
function help(where){setPanel('FIELD MANUAL','<div class="card"><h3>KEYBOARD</h3><p>Move: A/D or ←/→<br>Jump / double jump: Space, Z or ↑<br>Slash combo: X / J (hold to chain)<br>Dash: Shift / C<br>Blaster: V / K · hold to charge, release to fire<br>Pause: Escape / P · Upgrades: B</p></div><div class="card"><h3>STANDARD CONTROLLER</h3><p>D-pad / left stick: move · A: jump<br>X: slash · B / RB: dash · Y / RT: blaster<br>Start: pause · LB / View: upgrades</p><p class="muted">Xbox-style labels. On PlayStation: Cross jumps, Square slashes, Circle dashes, Triangle fires. Menus: D-pad to focus, A to select, B to go back. Sliders use the keyboard or touch.</p></div><p class="muted">Pair Bluetooth in your device settings, open in a current browser over HTTPS or localhost, then press a controller button. Requires a browser-standard mapping; support varies by controller and OS. Touch: hold move + an action together. Landscape gives the best view.</p><div class="card"><h3>SURVIVAL</h3><p>Dash gives brief invulnerability but costs energy. One air dash per jump. Saber reflects enemy projectiles. Three-hit combo ends with a heavy sweep. Green relays restore armor and save a checkpoint for this stage attempt. Continue starts the saved stage, not an exact mid-stage position.</p></div><p class="muted">Eight stages + final encounter. Four-hour campaign duration is a design goal, not a measured claim. This is an original GBA-inspired canvas game, not a reproduction of Capcom artwork, animation frames, story, or music.</p>',[{label:'BACK',kind:'primary',back:true,run:()=>backTo(where)}],'help')}
function gameOver(){persist();setPanel('SIGNAL LOST','<p>The caravan is still waiting. Study the wind-up. Build a stronger blade. Try again.</p><p>Stage time '+clock(game.time)+' · robots defeated '+game.kills+'</p><p class="goldText">'+save.bananas+' bananas retained · all upgrades retained</p>',[{label:'RETRY STAGE',kind:'primary',run:()=>launch(game.stage)},{label:'UPGRADES',kind:'gold',run:()=>shop('intro',game.stage)},{label:'STAGE SELECT',run:stageSelect}],'over')}
function clearStage(){const n=game.stage;if(!save.cleared.includes(n))save.cleared.push(n);save.unlocked=Math.max(save.unlocked,Math.min(9,n+1));save.stage=Math.min(9,n+1);if(!save.best[n]||game.time<save.best[n])save.best[n]=game.time;for(const l of loot)save.bananas+=l.v;loot=[];persist();if(n===9){save.won=true;persist();story(['DAWN // OPEN CIRCUIT','Kip lowers the saber. Nori opens the weather grid to every settlement, not just the citadel. The engine begins its first shared sunrise.','The caravan plants its seeds beside the orchard, not behind its walls. No family has to ask permission for a season again.','THANK YOU FOR PLAYING BANANA SIGNAL. All relays remain available for replay.'],()=>setPanel('THE ORCHARD IS OPEN','<p>Campaign complete. Bananas and upgrades are saved.</p><p>Play time '+clock(save.time)+' · defeats '+save.deaths+' · robots '+save.kills+'</p><p class="muted">Try a harder difficulty or improve your stage times.</p>',[{label:'STAGE SELECT',kind:'primary',run:stageSelect},{label:'MAIN MENU',back:true,run:menu}],'win'));return}setPanel('RELAY '+n+' RESTORED','<p>'+['Crystal light reaches the caravan. Nori repairs the seed-vault cooling loop.','The soil filters are clean. For the first time in weeks, a seed sprouts.','Freshwater flows. The families fill their flasks and keep moving.','Warm air reaches the seedlings. Kip leaves the forge cooling behind him.','The wind changes. Caravan kites carry a signal to the city gates.','The archive is broadcast. Even the citadel guards can see the orchard is alive.','Power flows to every camp on the road. The spire is the final lock.','The eight relays are open. The Dawn Engine is fighting the transfer. One last signal.'][n-1]+'</p><p>TIME '+clock(game.time)+' · ROBOTS '+game.kills+'</p><p class="goldText">BANANAS '+save.bananas+' · guardian bounty collected</p>',[{label:n===8?'ENTER DAWN ENGINE':'NEXT RELAY',kind:'primary',run:()=>intro(n+1)},{label:'UPGRADES',kind:'gold',run:()=>shop('intro',n+1)},{label:'STAGE SELECT',run:stageSelect}],'clear')}
$('pauseButton').onclick=pauseMenu;$('shopButton').onclick=()=>{if(game.state==='play')shop('pause')};
// Original low-resolution sprites: no external artwork or animation assets.
ctx.imageSmoothingEnabled=false;
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function label(value,x,y,color='#e7f5fb',size=8,align='left'){ctx.font=size+'px monospace';ctx.textAlign=align;ctx.fillStyle='#081221';ctx.fillText(value,Math.round(x)+1,Math.round(y)+1);ctx.fillStyle=color;ctx.fillText(value,Math.round(x),Math.round(y));ctx.textAlign='left'}
function bar(x,y,w,h,value,max,color){rect(x-1,y-1,w+2,h+2,'#9eb5c8');rect(x,y,w,h,'#172238');rect(x,y,w*clamp(value/Math.max(1,max),0,1),h,color)}
function banana(x,y,scale=1){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(scale,scale);rect(1,0,2,3,'#a38142');rect(2,3,3,4,'#fff299');rect(5,5,3,3,'#ffe05c');rect(8,3,2,4,'#e7a747');rect(2,7,6,2,'#ad712c');ctx.restore()}
function drawRunner(p,ghost=false){
 if(p.dead)return;if(!ghost&&p.inv>0&&Math.floor(tick/5)%2)return;
 const run=Math.abs(p.vx)>12&&p.ground,step=run?Math.sin(tick*.45)*3:0;
 ctx.save();ctx.translate(Math.round(p.x+p.w/2),Math.round(p.y));ctx.scale(p.face,1);
 rect(-10,23,7,4,'#1a1933');rect(-13,18,5,7,'#9b6856');rect(-15,13,4,7,'#b98163');rect(-13,11,5,3,'#cf9976');
 rect(-6,22+step,5,8-step,'#47788b');rect(2,22-step,5,8+step,'#3ad4c7');rect(-8,28,8,3,'#d2e7de');rect(2,28,9,3,'#e2fff0');
 rect(-7,12,14,12,'#185565');rect(-7,12,14,4,'#55e2cf');rect(-5,16,9,6,'#2e9eaa');rect(-2,17,3,3,'#ffe18b');
 rect(-9,1,4,8,'#ae725c');rect(6,2,4,7,'#ae725c');rect(-6,0,13,13,'#a36755');rect(-7,0,14,4,'#66eed7');rect(-5,-2,10,3,'#b3fff0');rect(-4,6,11,7,'#e6af7d');rect(0,5,7,4,'#192743');rect(3,5,4,2,'#b9fdff');
 const arm=p.attack>0?5:0;rect(5,13,5,8,'#58d5c7');rect(7,18-arm,6,4,'#e6af7d');rect(10,17-arm,3,6,'#6a5fa1');
 rect(-7,9,5,3,'#ff797a');rect(-16,10+Math.sin(tick*.12)*2,10,3,'#ce4b6a');rect(-21,12+Math.sin(tick*.12)*2,7,2,'#ff9a8c');
 if(p.charge>.1){rect(12,17,5,4,p.charge>.9?'#fff5a7':'#83cfff');if(tick%12<6)rect(11,15,7,8,'#c7fdff')}
 ctx.restore();
 if(p.attack>0){const b=slashBox(),phase=1-p.attack/(p.combo===3?.27:.19);ctx.save();ctx.translate(p.x+9,p.y+16);ctx.scale(p.face,1);ctx.strokeStyle=p.combo===3?'#fff2b0':'#c4ffed';ctx.lineWidth=p.combo===3?5:3;ctx.beginPath();ctx.arc(0,0,b.w,-1.3+phase*.6,1.2+phase*.6);ctx.stroke();ctx.strokeStyle='#52e1d8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,b.w-6,-1.1,1.2);ctx.stroke();ctx.restore()}
}
function robot(e,boss=false){
 const s=stages[game.stage-1]||stages[0],kind=boss?s.kind:e.type,col=e.hit>0?'#ffffff':boss?s.color:'#8d91c7',dark='#26364d',metal='#c0d6df';
 ctx.save();ctx.translate(Math.round(e.x+e.w/2),Math.round(e.y));ctx.scale((e.face||1)*(boss?1.8:1),boss?1.8:1);
 if(kind==='wasp'||kind==='drone'){const flap=Math.sin(tick*.5)*4;rect(-18,3+flap,12,3,'#a3eaff');rect(7,3-flap,12,3,'#a3eaff');rect(-9,4,18,12,dark);rect(-8,3,16,6,col);rect(-4,9,10,3,'#ff727e');rect(-4,15,7,4,metal);rect(-2,19,3,5,'#ffd773')}
 else if(kind==='gorilla'){rect(-12,6,24,17,dark);rect(-12,5,24,8,col);rect(-17,8,7,18,col);rect(10,8,7,18,col);rect(-18,22,9,5,metal);rect(10,22,9,5,metal);rect(-8,0,16,11,col);rect(-7,4,13,3,'#ff7679');rect(-8,22,6,8,dark);rect(3,22,6,8,dark);rect(-10,28,9,3,metal);rect(3,28,9,3,metal)}
 else if(kind==='spider'){for(const side of [-1,1])for(let i=0;i<3;i++){rect(side*(9+i*4)-2,9+i*4,8,3,col);rect(side*(14+i*4)-2,11+i*4,3,10,metal)}rect(-9,4,18,16,col);rect(-6,8,13,3,'#ff829e');rect(-3,18,3,6,metal);rect(3,18,3,6,metal)}
 else if(kind==='turret'){rect(-10,9,20,13,dark);rect(-8,4,16,10,col);rect(4,6,13,5,metal);rect(-3,8,5,3,'#ff9a8b');rect(-12,20,24,3,metal)}
 else{rect(-12,9,24,11,dark);rect(-10,3,20,13,col);rect(-2,0,4,17,metal);rect(4,8,7,3,'#ff8190');for(const x of [-10,-3,5]){rect(x,19,3,4,metal);rect(x-2,22,6,2,dark)}rect(8,0,3,7,col)}
 ctx.restore();if(!boss&&e.hp<e.maxHp)bar(e.x,e.y-5,e.w,2,e.hp,e.maxHp,'#ffb18b');
}
function background(){
 const s=stages[(game.stage||1)-1],cam=level?game.cam:tick*.15;rect(0,0,W,H,s.sky);
 for(let i=0;i<32;i++){const x=((i*83-cam*.12)%520+520)%520;rect(x,(i*47)%157,1+(i%2),1,'#91b2d0')}
 rect(355-cam*.025%500,28,38,38,'#667b9566');rect(362-cam*.025%500,32,22,28,'#a2bfd644');
 for(let i=-1;i<9;i++){const x=i*90-(cam*.22%90);rect(x,100+(i%3)*19,66,180,'#15273d');rect(x+4,103+(i%3)*19,57,4,'#34465d');for(let j=0;j<4;j++)rect(x+10+j*12,135+(i%3)*19,3,5,'#597c8855')}
 for(let i=-1;i<8;i++){const x=i*110-(cam*.5%110);rect(x,202,65,80,'#21374a');rect(x+5,208,55,4,'#3a5367');rect(x+11,225,20,23,'#0d2037');rect(x+34,222,5,4,s.color)}
 rect(0,268,W,52,'#0a172b');
}
function drawLevel(){
 for(const s of level.solids){if(s.x+s.w<game.cam||s.x>game.cam+W||s.y<100)continue;rect(s.x,s.y,s.w,s.h,'#223346');rect(s.x,s.y,s.w,3,'#a4c3be');rect(s.x,s.y+3,s.w,5,'#55798a');for(let x=Math.floor(s.x/24)*24;x<s.x+s.w;x+=24){rect(Math.max(x,s.x),s.y+10,Math.min(20,s.x+s.w-Math.max(x,s.x)),3,'#354b60');rect(Math.max(x,s.x),s.y+28,Math.min(20,s.x+s.w-Math.max(x,s.x)),2,'#15253a')}}
 for(const s of level.platforms){if(s.x+s.w<game.cam||s.x>game.cam+W)continue;rect(s.x,s.y,s.w,3,'#add8d0');rect(s.x,s.y+3,s.w,7,'#425773');rect(s.x+4,s.y+10,5,7,'#1b293e');rect(s.x+s.w-10,s.y+10,5,7,'#1b293e')}
 for(const h of level.hazards)for(let x=h.x;x<h.x+h.w;x+=7){ctx.fillStyle='#fa8f99';ctx.beginPath();ctx.moveTo(x,h.y+h.h);ctx.lineTo(x+3,h.y);ctx.lineTo(x+6,h.y+h.h);ctx.fill()}
 for(const d of level.decor){if(d.x<game.cam-40||d.x>game.cam+W)continue;if(d.kind==='crystal'){rect(d.x,d.y-23,5,23,'#5479c9');rect(d.x+5,d.y-34,8,34,'#8da8f1');rect(d.x+7,d.y-30,3,24,'#b6f5ef');rect(d.x+13,d.y-17,6,17,'#7972c1')}else if(d.kind==='console'){rect(d.x,d.y-23,19,23,'#364d66');rect(d.x+3,d.y-20,13,8,'#80dac9');rect(d.x+5,d.y-7,3,3,'#f7cf86')}}
 for(const c of level.checkpoints){rect(c.x,c.y,18,32,'#30445b');rect(c.x+4,c.y+4,10,19,c.active?'#83ffd2':'#c0a6fc');rect(c.x+7,c.y+7,4,13,'#f3ffef');if(!c.active)label('RELAY',c.x+9,c.y-5,'#b8eedf',6,'center')}
 if(!game.boss){rect(level.arena,GROUND-65,6,65,'#ffca7e');label('GUARDIAN',level.arena+10,GROUND-54,'#ffe7ac',7)}
}
function hud(){
 rect(5,5,158,34,'#101d31e8');label('KIP',10,14,'#8df7de',8);bar(35,8,102,7,player.hp,player.maxHp,'#74edc3');bar(35,20,102,4,player.en,player.maxEn,'#81b6ff');label(Math.ceil(player.hp)+'',143,15,'#e6f9ed',7);label('ION',10,26,'#a9cbff',7);
 banana(172,8);label(String(save.bananas),187,16,'#ffdf7b',9);label('R'+game.stage+'  '+clock(game.time),W-8,44,'#d8dfe9',8,'right');label('RETRY '+Math.max(0,game.retries),8,49,'#bed0dd',7);label((game.difficulty||settings.difficulty).toUpperCase(),8,59,'#b5accb',7);
 if(game.boss&&!game.boss.dead){const b=game.boss;rect(103,287,274,26,'#101b2be8');label(stages[game.stage-1].boss+(b.phase===2?' // OVERCLOCK':''),240,297,'#ffde9d',8,'center');bar(111,302,258,5,b.hp,b.maxHp,stages[game.stage-1].color);if(b.state==='tell'){label(b.warning,240,78,'#ffe27e',11,'center');if(b.action==='rain'||b.action==='blink'){rect(b.lockedX-game.cam,94,2,180,'#ff9a6966')}}}
 else if(level){bar(170,25,95,3,player.x,level.width,'#ccb3ed');label('RELAY APPROACH',170,37,'#a9c2d8',6)}
 if(player.dead){rect(0,120,W,45,'#10162dcc');label('SIGNAL INTERRUPTED',W/2,145,'#ff9b9d',14,'center')}
}
function render(){
 ctx.setTransform(1,0,0,1,0,0);background();
 if(level&&player){ctx.save();const shake=settings.shake?game.shake:0;ctx.translate(-Math.floor(game.cam)+(Math.random()-.5)*shake,(Math.random()-.5)*shake);drawLevel();
 for(const l of loot)if(Math.abs(l.x-game.cam)<W+20)banana(l.x,l.y);
 for(const e of enemies)if(!e.dead&&e.x+e.w>game.cam-30&&e.x<game.cam+W+30)robot(e);
 if(game.boss&&!game.boss.dead)robot(game.boss,true);
 drawRunner(player);for(const b of shots){rect(b.x,b.y,b.w,b.h,b.friendly?'#c0fff0':'#ffbe85');rect(b.x+1,b.y+1,Math.max(1,b.w-2),Math.max(1,b.h-2),b.friendly?'#ffffff':'#fff1cd')}
 for(const e of effects)rect(e.x,e.y,3,3,e.color);for(const f of floating)label(f.value,f.x,f.y,f.color,8);ctx.restore();hud();
 }else{for(let i=0;i<20;i++){const x=(i*37+tick*.1)%W,y=240+Math.sin(i+tick*.01)*18;rect(x,y,3,3,'#8fd5ce')}label('DAWN CARAVAN // SIGNAL STANDBY',240,300,'#7292a6',8,'center')}
}
let lastFrame=0,accumulator=0;
function frame(now){const elapsed=lastFrame?Math.min((now-lastFrame)/1000,.1):0;lastFrame=now;accumulator+=elapsed;
 // Fixed 120 Hz simulation prevents refresh-rate-dependent movement and collision tunneling.
 let steps=0;while(accumulator>=1/120&&steps<12){pollInput();update(1/120);game.shake=Math.max(0,game.shake-25/120);accumulator-=1/120;tick++;steps++}
 audio.update();render();requestAnimationFrame(frame);
}
addEventListener('pagehide',persist);addEventListener('resize',updateControls);
menu();requestAnimationFrame(frame);
</script>
