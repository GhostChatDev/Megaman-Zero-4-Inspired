<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17171C">
<title>Nighttail: The Hollow Crown</title>
<style>
:root{--paper:#EEE7D7;--ink:#17171C;--accent:#BA3848;--r:8px;--t:200ms;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;color:var(--paper);background:var(--ink)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#shell{position:fixed;inset:0;display:grid;place-items:center}
#view{position:relative;width:min(100vw,150dvh);aspect-ratio:3/2;max-height:100dvh}
canvas#game{width:100%;height:100%;display:block;image-rendering:pixelated;background:var(--ink)}
h1,h2,p{margin:0}
h1{font-size:32px;line-height:1.1}
h2{font-size:20px;line-height:1.2}
p,li,label,button,select{font-size:14px;line-height:1.4}
#hud{position:fixed;inset:0;pointer-events:none;z-index:4;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
#hud[hidden]{display:none}
.hudTop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chip{background:#17171Ccc;border:1px solid #EEE7D744;border-radius:var(--r);padding:8px;display:flex;gap:8px;align-items:center;pointer-events:auto}
.meter{width:min(120px,24vw);height:8px;background:#EEE7D733;border-radius:var(--r);overflow:hidden}
.meter i{display:block;height:100%;background:var(--paper);width:100%}
.meter.boss i{background:var(--accent)}
#bossChip{position:absolute;left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top))}
#bossChip[hidden]{display:none}
#bossChip .meter{width:min(200px,36vw)}
#pauseBtn{min-width:44px;min-height:44px;justify-content:center}
#toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(560px,92vw);background:#17171Cee;border:1px solid var(--accent);border-radius:var(--r);padding:8px 16px;z-index:6;opacity:0;transition:opacity var(--t) ease-out;pointer-events:none;text-align:center}
#toast.show{opacity:1}
#overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:#17171Cd9}
#overlay[hidden]{display:none}
#panel{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:var(--r);padding:24px;display:grid;gap:16px;animation:rise 240ms ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#panel .muted{opacity:.75}
#panel .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
#panel .row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 0;border-bottom:1px solid #17171C22}
#panel ul{margin:0;padding-left:16px}
button{font:inherit;min-height:44px;padding:8px 16px;border-radius:var(--r);border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;transition:background var(--t) ease-out,transform 150ms ease-out,color var(--t) ease-out}
button.alt{background:transparent;color:var(--ink)}
button:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--paper)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select{font:inherit;min-height:44px;border-radius:var(--r);border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:8px}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
input[type=range]{accent-color:var(--accent);width:min(160px,40vw)}
.stage{display:grid;gap:8px;text-align:left;background:transparent;color:var(--ink)}
.stage b{font-size:14px}
.stage.done{border-color:var(--accent)}
#touch{position:fixed;inset:0;z-index:5;pointer-events:none;touch-action:none}
#touch[hidden]{display:none}
#stickZone{position:absolute;left:0;bottom:0;width:45%;height:60%;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;border:2px solid #EEE7D766;background:#17171C66}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#EEE7D7aa}
#pad{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px;pointer-events:auto}
#pad button{width:64px;height:64px;padding:0;border-radius:50%;background:#17171Caa;border-color:#EEE7D788;color:var(--paper);touch-action:none}
#pad button.on{background:var(--accent);border-color:var(--paper)}
#pad svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="shell"><div id="view"><canvas id="game" width="480" height="320" aria-label="Nighttail game view"></canvas></div></div>
<div id="hud" hidden>
  <div class="hudTop">
    <div class="chip" aria-label="Rook health"><span>Rook</span><span class="meter"><i id="hpBar"></i></span></div>
    <div class="chip" id="weaponChip" aria-live="polite"><span id="weaponText">Darts</span></div>
    <button class="chip" id="pauseBtn" aria-label="Pause"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3" height="12" fill="currentColor"/><rect x="10" y="2" width="3" height="12" fill="currentColor"/></svg></button>
  </div>
  <div class="chip" id="bossChip" hidden><span id="bossName">Boss</span><span class="meter boss"><i id="bossBar"></i></span></div>
</div>
<div id="touch" hidden aria-label="Touch controls">
  <div id="stickZone"><div id="stick"><div id="knob"></div></div></div>
  <div id="pad">
    <button data-act="steal" aria-label="Steal or use weapon"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    <button data-act="shoot" aria-label="Throw darts"><svg viewBox="0 0 24 24"><path d="M4 12h12M13 8l4 4-4 4"/></svg></button>
    <button data-act="dash" aria-label="Dash"><svg viewBox="0 0 24 24"><path d="M3 8h10M3 16h10M14 6l6 6-6 6"/></svg></button>
    <button data-act="slash" aria-label="Blade"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M15 5h4v4"/></svg></button>
    <button data-act="jump" aria-label="Jump" style="grid-column:2/4"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  </div>
</div>
<div id="overlay"><main id="panel" aria-live="polite"><h2>Loading Nighttail…</h2></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:16px">Nighttail needs JavaScript to run.</p></noscript>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/input.js"></script>
<script src="js/play.js"></script>
<script src="js/bosses.js"></script>
<script src="js/draw.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
